<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- iPhone の Safari で、画面上部に iOS版のバナー(Apple 標準の Smart App Banner)を出す -->
<meta name="apple-itunes-app" content="app-id=6797180484">
<title>豊島区ごみ収集カレンダー(非公式)</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #23272e;
    --sub: #7a8089;
    --line: #e6e8ee;
    --accent: #0d9488;
    --seg-bg: #e8eaf0;
    --today-bg: #fff5ec;
    --today-line: #f2c39e;
    --c-burnable: #d9532f;
    --c-bottle: #22894f;
    --c-paper: #2670c2;
    --c-metal: #7a55b8;
    --c-sodai: #b0791f;
    --c-kyoten: #0d9488;
    --c-no: #98552d;
    --t-burnable: rgba(217,83,47,.12);
    --t-bottle: rgba(34,137,79,.12);
    --t-paper: rgba(38,112,194,.11);
    --t-metal: rgba(122,85,184,.12);
    --t-sodai: rgba(176,121,31,.13);
    --t-kyoten: rgba(13,148,136,.11);
    --t-no: rgba(152,85,45,.12);
    --shadow: 0 1px 3px rgba(15,20,30,.05);
  }
  :root[data-theme="dark"] {
    --bg: #0f1114;
    --card: #191c21;
    --text: #eceef1;
    --sub: #969da8;
    --line: #2a2e36;
    --accent: #2dd4bf;
    --seg-bg: #23272e;
    --today-bg: #2b2119;
    --today-line: #6b4a2e;
    --c-burnable: #ff8763;
    --c-bottle: #55c284;
    --c-paper: #6aa9ec;
    --c-metal: #b295e3;
    --c-sodai: #d9a44a;
    --c-kyoten: #2dd4bf;
    --c-no: #d98d63;
    --t-burnable: rgba(255,135,99,.15);
    --t-bottle: rgba(85,194,132,.15);
    --t-paper: rgba(106,169,236,.14);
    --t-metal: rgba(178,149,227,.15);
    --t-sodai: rgba(217,164,74,.15);
    --t-kyoten: rgba(45,212,191,.13);
    --t-no: rgba(217,141,99,.15);
    --shadow: none;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding-bottom: calc(66px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 12px 14px 32px; }
  /* 月間カレンダー表示中は画面幅いっぱいまで使う */
  .wrap.full { max-width: 1700px; }
  header.app {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 2px 12px; gap: 8px;
  }
  header.app h1 { font-size: 17px; font-weight: 800; letter-spacing: .01em; }
  .hdr-actions { display: flex; gap: 8px; align-items: center; flex: none; }
  .icon-btn {
    height: 34px; padding: 0 12px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    font-size: 12px; font-weight: 600; font-family: inherit;
    line-height: 1; cursor: pointer; white-space: nowrap;
  }
  .area-btn {
    font-size: 12px; font-weight: 600; color: var(--accent);
    background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 7px 13px;
    font-family: inherit; cursor: pointer; white-space: nowrap;
  }
  .card {
    background: var(--card); border-radius: 16px;
    border: 1px solid var(--line);
    padding: 16px; margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  .area-name { font-size: 12px; color: var(--sub); margin-bottom: 10px; }

  /* 品目カラー: 各要素に品目クラスを付けると --col / --tint が決まる */
  .burnable          { --col: var(--c-burnable); --tint: var(--t-burnable); }
  .bottleCanPet      { --col: var(--c-bottle);   --tint: var(--t-bottle); }
  .paperPlastic      { --col: var(--c-paper);    --tint: var(--t-paper); }
  .metalCeramicGlass { --col: var(--c-metal);    --tint: var(--t-metal); }
  .cat-sodai         { --col: var(--c-sodai);    --tint: var(--t-sodai); }
  .cat-kyoten        { --col: var(--c-kyoten);   --tint: var(--t-kyoten); }
  .cat-no            { --col: var(--c-no);       --tint: var(--t-no); }

  /* ── 今日の収集バナー ── */
  .today-banner {
    border: 1px solid var(--today-line);
    background: var(--today-bg);
  }
  .banner-label { font-size: 12px; font-weight: 700; color: var(--sub); letter-spacing: .04em; margin-bottom: 4px; }
  .banner-main { font-size: 22px; font-weight: 800; line-height: 1.3; }
  .banner-items { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 13px; font-weight: 700;
    padding: 6px 12px; border-radius: 999px;
    background: var(--tint); color: var(--col);
  }
  .chip svg { width: 15px; height: 15px; flex: none; }
  .deadline { margin-top: 10px; font-size: 14px; font-weight: 600; }

  /* ── 次の収集カード ── */
  .next-main { font-size: 26px; font-weight: 800; line-height: 1.3; }

  /* ── 表示切替(2週間/月間) ── */
  .seg {
    display: flex; background: var(--seg-bg); border-radius: 12px;
    padding: 3px; margin: 4px 0 12px;
  }
  .seg button {
    flex: 1; font-size: 14px; font-weight: 700; font-family: inherit;
    padding: 8px 0; border: none; border-radius: 9px;
    background: none; color: var(--sub); cursor: pointer;
  }
  .seg button.on {
    background: var(--card); color: var(--text);
    box-shadow: 0 1px 3px rgba(0,0,0,.14);
  }

  /* ── 2週間リスト ── */
  .sched-row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 8px 2px; border-bottom: 1px solid var(--line);
  }
  .sched-row:last-child { border-bottom: none; }
  /* 通常行と完全に同じ寸法のまま背景色だけ変える(ズレ防止) */
  .sched-row.is-today {
    background: var(--today-bg); border-radius: 10px;
  }
  .sched-date { flex: 0 0 84px; font-size: 14px; font-weight: 700; padding-top: 3px; }
  .sched-date .wd { font-size: 12px; color: var(--sub); font-weight: 600; }
  .sched-date .wd.sat { color: var(--c-paper); }
  .sched-date .wd.sun { color: var(--c-burnable); }
  .sched-items { display: flex; flex-wrap: wrap; gap: 5px; }
  .sched-none { font-size: 12px; color: var(--sub); padding-top: 4px; }
  .tag {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; font-weight: 700; padding: 4px 9px;
    border-radius: 7px; background: var(--tint); color: var(--col);
  }
  .tag svg { width: 13px; height: 13px; flex: none; }

  /* ── 月間カレンダー ── */
  /* 月ナビと操作(今日へ/縦横/印刷)を1行にまとめて縦のスペースを節約 */
  .cal-head {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 8px; margin-bottom: 10px; padding: 0 4px;
  }
  .cal-head .nav { display: flex; align-items: center; gap: 8px; }
  .cal-head .tools { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .cal-head .title { font-size: 16px; font-weight: 800; }
  .cal-head .nav button {
    font-size: 18px; width: 36px; height: 36px; line-height: 1;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--text); cursor: pointer;
  }
  .cal-card { padding: 14px 6px; }
  .tbtn {
    font-family: inherit; font-size: 12px; font-weight: 700;
    padding: 7px 12px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    white-space: nowrap;
  }
  table.cal { width: 100%; border-collapse: collapse; table-layout: fixed; }
  table.cal th { font-size: 11px; color: var(--sub); padding-bottom: 5px; font-weight: 700; }
  table.cal th.sun { color: var(--c-burnable); }
  table.cal th.sat { color: var(--c-paper); }
  /* セルの height は最低値。テーブル全体には fitCalendar() が
     画面の残り高さを与えるので、行はそれに合わせて均等に伸びる */
  table.cal td {
    vertical-align: top; text-align: center;
    height: 76px; padding: 3px 2px;
    border-top: 1px solid var(--line);
  }
  table.cal td .d { font-size: 14px; font-weight: 700; }
  /* 前後の月の日: 日付・収集予定とも表示するが、半透明にして参考扱いとわかるように */
  table.cal td.other { opacity: .4; }
  table.cal td.today {
    background: var(--today-bg); border-radius: 10px;
    box-shadow: inset 0 0 0 1.5px var(--today-line);
  }
  table.cal td.today .d { color: var(--c-burnable); font-weight: 800; }
  .cal-item {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    margin-top: 3px; padding: 4px 2px 5px; border-radius: 8px;
    background: var(--tint); color: var(--col);
  }
  .cal-item svg { width: 16px; height: 16px; flex: none; }
  .cal-item .cl {
    font-size: 9px; font-weight: 800; line-height: 1.25;
    word-break: break-all;
  }
  /* 画面に収まらないときに fitCalendar() が付ける縮小モード。
     画面フィット専用の仕組みなので、印刷には影響させない(詳細度が高く
     印刷用の寸法指定を上書きしてしまうため @media screen に閉じ込める) */
  @media screen {
    table.cal.cal-dense td { height: 40px; }
    table.cal.cal-dense td .d { font-size: 12px; }
    table.cal.cal-dense .cal-item { padding: 2px 1px 3px; margin-top: 2px; gap: 1px; border-radius: 6px; }
    table.cal.cal-dense .cal-item svg { width: 12px; height: 12px; }
    table.cal.cal-dense .cal-item .cl { font-size: 8px; }
    /* 高さが足りないときは前後の月の収集バッジ(参考情報)を省略して日付のみに */
    table.cal.cal-dense td.other .cal-item { display: none; }
  }

  /* ── 範囲印刷 ── */
  /* 印刷ボタンから開く「いつまで印刷するか」の選択ダイアログ */
  #printDialog {
    border: 1px solid var(--line); border-radius: 16px;
    background: var(--card); color: var(--text);
    padding: 20px; width: min(340px, calc(100vw - 48px));
    font-family: inherit;
    /* 全称セレクタの margin:0 リセットが UA の中央寄せ(margin:auto)を
       打ち消してしまうため明示的に戻す */
    margin: auto;
  }
  #printDialog::backdrop { background: rgba(0, 0, 0, .45); }
  .dlg-title { font-size: 16px; font-weight: 800; margin-bottom: 14px; }
  .dlg-row {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-size: 14px; font-weight: 600;
  }
  #printUntil {
    font-size: 14px; font-weight: 600; font-family: inherit;
    padding: 8px 10px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
  }
  .dlg-note { font-size: 12px; color: var(--sub); margin-top: 10px; }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  /* 文字色は --card(ライト=白/ダーク=濃色)でどちらのテーマでも accent 地に映える */
  .dlg-actions .primary { background: var(--accent); border-color: var(--accent); color: var(--card); }
  /* 印刷専用コンテナは画面には出さない */
  #printRange { display: none; }

  /* ── 地域選択 ── */
  .setup .step-title { font-size: 16px; font-weight: 800; margin-bottom: 12px; }
  .opt-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .opt-grid button {
    font-size: 15px; font-weight: 600; font-family: inherit;
    padding: 10px 16px; border-radius: 11px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    cursor: pointer;
  }
  .opt-grid button:active { background: var(--seg-bg); }
  .opt-list { display: flex; flex-direction: column; gap: 8px; }
  .opt-list button {
    font-size: 14px; font-family: inherit; text-align: left;
    padding: 12px 14px; border-radius: 11px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    cursor: pointer; line-height: 1.45;
  }
  .opt-list button .zone-note { display: block; font-size: 12px; color: var(--sub); margin-top: 3px; }
  .back-link {
    display: inline-block; margin-bottom: 12px;
    font-size: 14px; font-weight: 600; color: var(--accent);
    background: none; border: none; font-family: inherit; cursor: pointer; padding: 4px 0;
  }

  /* ── アコーディオン(details) 共通 ── */
  details.acc {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; margin-bottom: 8px; overflow: hidden;
  }
  details.acc > summary {
    list-style: none; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 12px 14px; font-size: 14px; font-weight: 700;
  }
  details.acc > summary::-webkit-details-marker { display: none; }
  details.acc > summary::after {
    content: ""; flex: none; width: 8px; height: 8px;
    border-right: 2px solid var(--sub); border-bottom: 2px solid var(--sub);
    transform: rotate(45deg); transition: transform .15s; margin-left: 4px;
  }
  details.acc[open] > summary::after { transform: rotate(-135deg); }
  details.acc .acc-body {
    padding: 2px 14px 14px; font-size: 14px;
    border-top: 1px solid var(--line); padding-top: 10px;
  }
  .rich { word-break: break-word; }
  .rich a { color: var(--accent); }

  /* ── 分別辞典 ── */
  .search-box {
    display: flex; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 12px; margin-bottom: 10px;
  }
  .search-box svg { width: 18px; height: 18px; color: var(--sub); flex: none; }
  .search-box input {
    flex: 1; border: none; background: none; color: var(--text);
    font-size: 16px; font-family: inherit; outline: none;
  }
  .cat-chips {
    display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px;
    margin-bottom: 8px; -webkit-overflow-scrolling: touch;
  }
  .cat-chips button {
    flex: none; font-size: 12px; font-weight: 700; font-family: inherit;
    padding: 6px 12px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--sub);
    white-space: nowrap;
  }
  .cat-chips button.on { border-color: var(--accent); color: var(--accent); background: var(--t-kyoten); }
  .kana-header {
    font-size: 13px; font-weight: 800; color: var(--sub);
    padding: 12px 4px 6px;
  }
  .jiten-badge {
    flex: none; font-size: 11px; font-weight: 700; padding: 3px 8px;
    border-radius: 6px; background: var(--tint); color: var(--col);
    white-space: nowrap;
  }
  .jiten-name { flex: 1; min-width: 0; }
  .jiten-count { font-size: 12px; color: var(--sub); margin: 2px 4px 8px; }
  .detail-label { font-size: 11px; font-weight: 700; color: var(--sub); margin: 8px 0 2px; letter-spacing: .04em; }

  /* ── 便利帳 ── */
  .benri-img { width: 100%; border-radius: 8px; display: block; }
  .benri-links { margin-top: 10px; font-size: 13px; }
  .benri-links a { color: var(--accent); word-break: break-all; }

  /* ── メニュー ── */
  .menu-list { display: flex; flex-direction: column; gap: 8px; }
  .menu-list button {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 15px; font-weight: 700; font-family: inherit; text-align: left;
    padding: 14px 16px; border-radius: 12px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
  }
  .menu-list button::after {
    content: ""; flex: none; width: 8px; height: 8px;
    border-right: 2px solid var(--sub); border-bottom: 2px solid var(--sub);
    transform: rotate(-45deg);
  }
  .menu-list .menu-note { display: block; font-size: 11px; font-weight: 500; color: var(--sub); margin-top: 2px; }
  .page-title { font-size: 18px; font-weight: 800; margin: 2px 2px 12px; }
  .section-title { font-size: 14px; font-weight: 800; color: var(--sub); margin: 16px 2px 8px; }
  .contact-title { font-size: 15px; font-weight: 800; }
  .contact-org { font-size: 13px; color: var(--sub); margin-top: 1px; }
  .snapshot-note {
    font-size: 12px; color: var(--sub); background: var(--seg-bg);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; line-height: 1.6;
  }
  .snapshot-note a { color: var(--accent); }

  /* ── 下部タブバー ── */
  #tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--card); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  #tabbar .inner {
    max-width: 520px; margin: 0 auto; display: flex;
  }
  #tabbar button {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 8px 0 6px; border: none; background: none; cursor: pointer;
    color: var(--sub); font-family: inherit; font-size: 10px; font-weight: 700;
  }
  #tabbar button svg { width: 22px; height: 22px; }
  #tabbar button.on { color: var(--accent); }

  /* ── iPhoneアプリ版への案内カード ── */
  /* 1行目にタイトルとボタン、2行目に説明を全幅で置く
     (横並び1行だとスマホ幅で説明が細く折り返し、カードが縦長になる) */
  .app-promo {
    display: grid; grid-template-columns: 1fr auto;
    align-items: center; column-gap: 10px; row-gap: 6px;
    margin-top: 14px; text-decoration: none; color: var(--text);
  }
  /* 幅375pxの iPhone でタイトルが1行に収まる大きさ(15pxだと1文字はみ出す) */
  .app-promo .promo-title { font-size: 14px; font-weight: 800; }
  .app-promo .promo-sub { grid-column: 1 / -1; font-size: 12px; color: var(--sub); line-height: 1.6; }
  .app-promo .promo-btn {
    font-size: 12px; font-weight: 700;
    padding: 7px 11px; border-radius: 999px;
    background: var(--accent); color: var(--card); white-space: nowrap;
  }

  footer {
    margin-top: 20px; font-size: 11px; color: var(--sub);
    text-align: center; line-height: 1.7;
  }
  footer a { color: var(--accent); }

  /* ── PC など広い画面では全体を拡大 ── */
  @media (min-width: 700px) {
    .wrap { max-width: 900px; padding: 20px 24px 48px; }
    header.app h1 { font-size: 24px; }
    .icon-btn { height: 42px; padding: 0 16px; font-size: 14px; }
    .area-btn { font-size: 14px; padding: 9px 18px; }
    .area-name { font-size: 15px; }
    .card { padding: 24px; border-radius: 20px; }
    .banner-label { font-size: 14px; }
    .banner-main { font-size: 30px; }
    .next-main { font-size: 34px; }
    .chip { font-size: 16px; padding: 8px 16px; }
    .chip svg { width: 19px; height: 19px; }
    .deadline { font-size: 17px; }
    .sched-row { padding: 11px 4px; }
    .sched-date { flex: 0 0 118px; font-size: 17px; }
    .sched-date .wd { font-size: 15px; }
    .sched-none { font-size: 14px; }
    .tag { font-size: 15px; padding: 6px 12px; }
    .tag svg { width: 16px; height: 16px; }
    .seg button { font-size: 16px; padding: 10px 0; }
    .cal-head .title { font-size: 20px; }
    .cal-head .nav button { font-size: 22px; width: 44px; height: 44px; }
    .cal-card { padding: 24px 16px; }
    table.cal th { font-size: 14px; padding-bottom: 8px; }
    table.cal td { height: 96px; padding: 6px 4px; }
    table.cal td .d { font-size: 18px; }
    .cal-item { padding: 7px 4px 8px; margin-top: 5px; border-radius: 10px; gap: 3px; }
    .cal-item svg { width: 24px; height: 24px; }
    .cal-item .cl { font-size: 13px; }
    .tbtn { font-size: 14px; padding: 9px 16px; }
    .setup .step-title { font-size: 19px; }
    .opt-grid button { font-size: 17px; padding: 12px 20px; }
    .opt-list button { font-size: 16px; padding: 14px 18px; }
    details.acc > summary { font-size: 16px; padding: 15px 18px; }
    details.acc .acc-body { font-size: 15px; padding: 12px 18px 16px; }
    .search-box input { font-size: 17px; }
    .cat-chips button { font-size: 14px; padding: 8px 15px; }
    .menu-list button { font-size: 17px; padding: 17px 20px; }
    .page-title { font-size: 22px; }
    .app-promo .promo-title { font-size: 17px; }

    body.print-multi #app { display: none !important; }

    .print-page { page-break-after: always; }
    .print-page:last-child { page-break-after: auto; }
  }
  /* 印刷設定で選んだ用紙の向きに追従して、どちらでも1枚いっぱいに広げる。
     印刷時のメディアクエリは「用紙」の縦横で評価される。

// 分別辞典の分別区分 → 色クラス。

const JITEN_CAT_CLASS = {

};
// 辞典のカテゴリ絞り込みチップ(表示ラベル → cat文字列)
const JITEN_FILTERS = [

  ["燃やす", "燃やすごみ"],
  ["びん・かん・ペット", "資源（びん・かん・ペットボトル）"],

  ["プラ", "資源（プラスチック）"],
  ["金属・陶器・ガラス", "金属・陶器・ガラスごみ"],
  ["粗大ごみ", "粗大ごみ"],
  ["拠点回収", "区施設等拠点回収"],
  ["収集不可", "収集できません"],
];

const STORAGE_KEY = "toshimaGomi.areaId";
const THEME_KEY = "toshimaGomi.theme"; // "auto" | "light" | "dark"

/* ---------- テーマ ---------- */
const THEME_LABELS = { auto: "🌓 自動", light: "☀️ ライト", dark: "🌙 ダーク" };
const THEME_ORDER = ["auto", "light", "dark"];

function currentTheme() {
  const t = localStorage.getItem(THEME_KEY);
  return THEME_ORDER.includes(t) ? t : "auto";
}
// html要素の data-theme を必ず "light" か "dark" に確定させる。
// auto のときだけ OS 設定(prefers-color-scheme)に追従する。
function applyTheme() {
  const t = currentTheme();
  const dark = t === "dark" ||
    (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
}
function cycleTheme() {
  const next = THEME_ORDER[(THEME_ORDER.indexOf(currentTheme()) + 1) % THEME_ORDER.length];
  localStorage.setItem(THEME_KEY, next);
  applyTheme();
}

/* =====================================================================
 * 「第n ◯曜日」判定 — このアプリの計算の要
 *
 * 豊島区の収集表にある「第1・3」は、
 *   「その月に 1番目 / 3番目 に *来る* その曜日」
 * という意味であり、「その月の第n週」や ISO 週番号とは無関係。
 * 例: 月の1日が金曜なら、その日が「第1金曜」。カレンダー上の週の
 * 区切り(日曜始まり等)がどうであっても影響しない。
 *
 * したがって判定は日付だけで決まる:
 *   1〜7日  → その曜日として月内 1番目
 *   8〜14日 → 2番目
 *   15〜21日 → 3番目
 *   22〜28日 → 4番目
 *   29〜31日 → 5番目(豊島区に「第5」の収集は存在しないため、
 *              データの nth に 5 が入らず自然に収集なしとなる)
 * ===================================================================== */
function nthOccurrenceOfWeekday(date) {
  return Math.ceil(date.getDate() / 7);
}

/**
 * 公式カレンダーで収集が無いとされている日(年末年始など)か。
 * DATA.closedDates は "2026-12-31" 形式で、曜日のルールでは表せない区内共通の例外。
 * (|| [] は、公開直後に新しいページと古い toshima-gomi.json が組み合わさった場合の保険)
 */
function isClosedDate(date) {
  const pad = n => String(n).padStart(2, "0");
  const key = `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
  return (DATA.closedDates || []).includes(key);
}

/**
 * 指定エリア・指定日に収集される品目キーの配列を返す(表示順)。
 * burnable / bottleCanPet / paperPlastic は毎週(曜日配列)、
 * metalCeramicGlass のみ「第n曜日」指定。
 * 収集の無い日 (isClosedDate) は、曜日が合っていても空を返す。ホーム・カレンダー・
 * 印刷はすべてここを通るので、判定はこの1か所だけでよい。
 */
function collectionsOn(area, date) {
  if (isClosedDate(date)) return [];
  const wd = WEEKDAY_KEYS[date.getDay()];
  const result = [];
  for (const key of CATEGORY_ORDER) {
    if (key === "metalCeramicGlass") {
      const spec = area.metalCeramicGlass;
      if (spec.weekday === wd && spec.nth.includes(nthOccurrenceOfWeekday(date))) {
        result.push(key);
      }
    } else if (area[key].includes(wd)) {
      result.push(key);
    }
  }
  return result;
}

/* ---------- 日付ユーティリティ ---------- */
function today0() {
  const now = new Date();
  return new Date(now.getFullYear(), now.getMonth(), now.getDate());
}
function addDays(date, n) {
  return new Date(date.getFullYear(), date.getMonth(), date.getDate() + n);
}
function sameDay(a, b) {
  return a.getFullYear() === b.getFullYear() &&
         a.getMonth() === b.getMonth() &&
         a.getDate() === b.getDate();
}
function fmtDate(date) {
  return `${date.getMonth() + 1}月${date.getDate()}日(${WEEKDAY_JP[date.getDay()]})`;
}

/** 締切時刻。繁華街(downtown)エリアのみ朝7:30、それ以外は朝8:00。 */
function deadlineOf(area) {
  return area.zone === "downtown"
    ? DATA.meta.rules.deadlineDowntown
    : DATA.meta.rules.deadlineNormal;
}
function isPastDeadline(area) {
  const [h, m] = deadlineOf(area).split(":").map(Number);
  const now = new Date();
  return now.getHours() * 60 + now.getMinutes() >= h * 60 + m;
}

/** 「次に出せる」収集日。今日が収集日でも締切時刻を過ぎていれば翌日以降を探す
 *  (iOS版 nextCollection と同じ挙動)。 */
function nextCollection(area) {
  const today = today0();
  for (let i = 0; i < 60; i++) {
    const d = addDays(today, i);
    const items = collectionsOn(area, d);
    if (!items.length) continue;
    if (i === 0 && isPastDeadline(area)) continue;
    return { date: d, items };
  }
  return null;
}

/** "明日 8月6日(水)" のような相対表現つき日付 */
function fmtRelative(date) {
  const today = today0();
  if (sameDay(date, today)) return `今日 ${fmtDate(date)}`;
  if (sameDay(date, addDays(today, 1))) return `明日 ${fmtDate(date)}`;
  return fmtDate(date);
}

/* ---------- 状態 ---------- */
function loadArea() {
  const id = localStorage.getItem(STORAGE_KEY);
  return DATA.areas.find(a => a.id === id) || null;
}
const app = document.getElementById("app");
let calYear, calMonth; // 表示中のカレンダー年月
// タブと表示形式は永続化しない(起動時は常にカレンダーの月間表示から始める)
let tab = "cal";
let calViewMode = "month";  // "twoweeks" | "month"
let menuPage = null;   // メニュータブ内のサブページ
let jitenQuery = "";
let jitenCat = "";

/* ---------- エスケープ ---------- */
function esc(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

    <h1>豊島区ごみ収集カレンダー</h1>

}

/** 出典の取得日。収集曜日 (DATA) も分別辞典など (APP_DATA) も同じ公式Web版を

/* =====================================================================
 * 地域選択フロー: 町名 → 丁目 → (番地条件があれば候補選択)
 * ===================================================================== */
function renderSetup(step, sel) {
  sel = sel || {};
  let html = headerHtml(false) + `<div class="setup">`;

  if (step === "town") {
    const towns = [...new Set(DATA.areas.map(a => a.town))];
    html += `<div class="card">
      <div class="step-title">お住まいの町名を選んでください</div>
      <div class="opt-grid">` +
      towns.map(t => `<button data-town="${esc(t)}">${esc(t)}</button>`).join("") +
      `</div></div>`;
  } else if (step === "chome") {
    const chomes = [...new Set(
      DATA.areas.filter(a => a.town === sel.town).flatMap(a => a.chome)
    )].sort((x, y) => x - y);
    html += `<button class="back-link" data-back="town">‹ 町名を選び直す</button>
      <div class="card">
      <div class="step-title">${esc(sel.town)}の丁目を選んでください</div>
      <div class="opt-grid">` +
      chomes.map(c => `<button data-chome="${c}">${c}丁目</button>`).join("") +
      `</div></div>`;
  } else if (step === "banchi") {
    const cands = DATA.areas.filter(a =>
      a.town === sel.town && a.chome.includes(sel.chome));
    html += `<button class="back-link" data-back="chome">‹ 丁目を選び直す</button>
      <div class="card">
      <div class="step-title">${esc(sel.town)}${sel.chome}丁目の番地を選んでください</div>
      <div class="opt-list">` +
      cands.map(a => {
        const cond = a.banchiCondition || "全域";
        const zone = a.zone === "downtown"
          ? `<span class="zone-note">繁華街エリア(締切 朝7:30)</span>` : "";
        return `<button data-area="${esc(a.id)}">${esc(cond)}${zone}</button>`;
      }).join("") +
      `</div></div>`;
  }

  html += `</div>` + footerHtml();
  app.innerHTML = html;
  bindHeader();

  app.querySelectorAll("[data-town]").forEach(b =>
    b.onclick = () => renderSetup("chome", { town: b.dataset.town }));
  app.querySelectorAll("[data-chome]").forEach(b =>
    b.onclick = () => {
      const chome = Number(b.dataset.chome);
      const cands = DATA.areas.filter(a =>
        a.town === sel.town && a.chome.includes(chome));
      if (cands.length === 1) {
        selectArea(cands[0].id);
      } else {
        renderSetup("banchi", { town: sel.town, chome });
      }
    });
  app.querySelectorAll("[data-area]").forEach(b =>
    b.onclick = () => selectArea(b.dataset.area));
  app.querySelectorAll("[data-back]").forEach(b =>
    b.onclick = () => renderSetup(b.dataset.back, sel));
}

function selectArea(id) {
  localStorage.setItem(STORAGE_KEY, id);
  const t = today0();
  calYear = t.getFullYear();
  calMonth = t.getMonth();
  render();
}

/* =====================================================================
 * カレンダータブ
 * ===================================================================== */
function chipsHtml(items, cls) {
  return items.map(k =>
    `<span class="${cls} ${k}">${ICONS[k]}<span>${esc(CATEGORIES[k].name)}</span></span>`
  ).join("");
}

function renderCalView() {
  const area = loadArea();
  const today = today0();
  const todayItems = collectionsOn(area, today);
  const view = calViewMode;
  // 月間表示のときだけコンテナ幅の上限を外して画面いっぱいに使う
  app.classList.toggle("full", view === "month");

  let html = headerHtml(true) +
    `<div class="area-name">📍 ${esc(area.label)}</div>`;

  /* 今日の収集バナー / 次の収集カード (排他表示):
     締切前の収集日はバナーのみ、それ以外は次の収集カードのみ */
  if (todayItems.length && !isPastDeadline(area)) {
    html += `<div class="card today-banner">
      <div class="banner-label">今日 ${fmtDate(today)}</div>
      <div class="banner-main">今日は ${todayItems.map(k => esc(CATEGORIES[k].name)).join("・")} の日</div>
      <div class="banner-items">${chipsHtml(todayItems, "chip")}</div>
      <div class="deadline">朝 ${deadlineOf(area)} までに出してください</div>
    </div>`;
  } else {
    const next = nextCollection(area);
    if (next) {
      html += `<div class="card next-card">
        <div class="banner-label">次の収集は</div>
        <div class="next-main">${fmtRelative(next.date)}</div>
        <div class="banner-items">${chipsHtml(next.items, "chip")}</div>
        <div class="deadline">朝 ${deadlineOf(area)} まで</div>
      </div>`;
    }
  }

  /* 表示切替タブ */
  html += `<div class="seg">
    <button data-view="twoweeks" class="${view === "twoweeks" ? "on" : ""}">2週間</button>
    <button data-view="month" class="${view === "month" ? "on" : ""}">月間</button>
  </div>`;

  if (view === "twoweeks") {
    /* 今日から14日間すべての日を表示(収集がない日は「収集なし」) */
    html += `<div class="card">`;
    for (let i = 0; i < 14; i++) {
      const d = addDays(today, i);
      const items = collectionsOn(area, d);
      const wdCls = d.getDay() === 0 ? "sun" : d.getDay() === 6 ? "sat" : "";
      html += `<div class="sched-row${i === 0 ? " is-today" : ""}">
        <div class="sched-date">${d.getMonth() + 1}/${d.getDate()}
          <span class="wd ${wdCls}">(${WEEKDAY_JP[d.getDay()]})</span></div>
        <div class="sched-items">${
          items.length ? chipsHtml(items, "tag")
                       : `<span class="sched-none">収集なし</span>`
        }</div>
      </div>`;
    }
    html += `</div>`;
  } else {
    /* 月間カレンダー(セル内にアイコン+品目名を表示するため凡例なし) */
    html += `<div class="card cal-card">${calendarHtml(area, calYear, calMonth, today)}</div>`;
  }

  html += appPromoHtml() + footerHtml();
  app.innerHTML = html;
  bindHeader();

  app.querySelectorAll(".seg [data-view]").forEach(b =>
    b.onclick = () => {
      calViewMode = b.dataset.view;
      renderCalView();
    });
  if (view === "month") {
    document.getElementById("calPrev").onclick = () => {
      calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; }
      renderCalView();
    };
    document.getElementById("calNext").onclick = () => {
      calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; }
      renderCalView();
    };
    document.getElementById("calToday").onclick = () => {
      const t = today0();
      calYear = t.getFullYear();
      calMonth = t.getMonth();
      renderCalView();
    };
    document.getElementById("calPrint").onclick = openPrintDialog;
    fitCalendar();
  }
}

/**
 * 画面表示用: カレンダーを画面にフィットさせる(さんあーる方式)。
 * 画面の残り高さ(ビューポート − テーブル上端 − タブバー)いっぱいに広げる
 * ので、画面の縦横(ウィンドウの形)にそのまま追従する。
 * 高さ指定だけではセル内容が大きいと縮まないので、1行あたりの高さ予算が
 * 足りないときは cal-dense クラスを付けてバッジ類を縮小し、確実に収める。
 */
function fitCalendar() {
  const table = app.querySelector("table.cal");
  if (!table) return;
  const top = table.getBoundingClientRect().top + window.scrollY;
  const tabbarH = document.getElementById("tabbar").offsetHeight;
  const h = Math.max(window.innerHeight - top - tabbarH - 12, 280);
  table.style.height = h + "px";
  // 1行に使える高さ(曜日ヘッダーぶん約30pxを引く)が通常サイズの
  // バッジに足りなければ縮小モードにする
  const rows = table.tBodies[0].rows.length;
  const perRow = (h - 30) / rows;
  table.classList.toggle("cal-dense", perRow < 78);
}
window.addEventListener("resize", fitCalendar);

/** 1日ぶんのセルHTML。表示中の月以外の日(前後の月のはみ出し分)は
 *  other クラスを付けて薄く表示する。収集予定も同様に表示する。 */
function calCellHtml(area, month, d, today) {
  const cls = [];
  if (d.getMonth() !== month) cls.push("other");
  if (sameDay(d, today)) cls.push("today");
  const items = collectionsOn(area, d);
  return `<td class="${cls.join(" ")}">
    <div class="d">${d.getDate()}</div>` +
    items.map(k =>
      `<span class="cal-item ${k}">${ICONS[k]}<span class="cl">${esc(CATEGORIES[k].name)}</span></span>`
    ).join("") +
  `</td>`;
}

/** 指定月のカレンダーテーブル(<table class="cal">)だけを返す。
 *  画面表示(calendarHtml)と範囲印刷(printMonths)の両方から使う。 */
function calTableHtml(area, year, month, today) {
  const first = new Date(year, month, 1);
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  // 月初を含む週の日曜〜月末を含む週の土曜まで、前後の月の日も含めて
  // 週ごとの Date 配列に展開する(空セルは作らない)
  const start = addDays(first, -first.getDay());
  const totalDays = Math.ceil((first.getDay() + daysInMonth) / 7) * 7;
  const weeks = [];
  for (let i = 0; i < totalDays; i += 7) {
    weeks.push(Array.from({ length: 7 }, (_, j) => addDays(start, i + j)));
  }

  // --weeks: 印刷CSSが行高を均等割りするための週数(月により4〜6)
  return `<table class="cal" style="--weeks:${weeks.length}"><thead><tr>` +
    WEEKDAY_JP.map((w, i) =>
      `<th class="${i === 0 ? "sun" : i === 6 ? "sat" : ""}">${w}</th>`).join("") +
    `</tr></thead><tbody>` +
    weeks.map(w =>
      `<tr>${w.map(d => calCellHtml(area, month, d, today)).join("")}</tr>`
    ).join("") +
    `</tbody></table>`;
}

function calendarHtml(area, year, month, today) {
  return `<div class="cal-head">
    <div class="nav">
      <button id="calPrev" aria-label="前の月">‹</button>
      <span class="title">${year}年${month + 1}月</span>
      <button id="calNext" aria-label="次の月">›</button>
    </div>
    <div class="tools">
      <button class="tbtn" id="calToday">今日へ</button>
      <button class="tbtn" id="calPrint">🖨 印刷</button>
    </div>
  </div>` + calTableHtml(area, year, month, today);
}

/* =====================================================================
 * 範囲印刷: 表示中の月から指定月まで、1か月1枚でまとめて印刷する。
 * 印刷ボタン → ダイアログで「いつまで」を選択 → #printRange に各月の
 * カレンダーを生成し、body.print-multi を付けて画面の代わりに印刷する。
 * Cmd+P などボタンを経由しない印刷は従来どおり表示中の月のみ。
 * ===================================================================== */
const printDialog = document.getElementById("printDialog");

function openPrintDialog() {
  // <dialog> 非対応の古いブラウザでは従来どおり表示中の月だけ印刷する
  if (!printDialog.showModal) { window.print(); return; }
  const sel = document.getElementById("printUntil");
  sel.innerHTML = Array.from({ length: 12 }, (_, i) => {
    const y = calYear + Math.floor((calMonth + i) / 12);
    const m = (calMonth + i) % 12;
    const note = i === 0 ? "この月のみ" : `${i + 1}か月分`;
    return `<option value="${y}-${m}">${y}年${m + 1}月(${note})</option>`;
  }).join("");
  document.getElementById("printFrom").textContent = `${calYear}年${calMonth + 1}月`;
  printDialog.showModal();
}

document.getElementById("printCancel").onclick = () => printDialog.close();
document.getElementById("printGo").onclick = () => {
  const [ey, em] = document.getElementById("printUntil").value.split("-").map(Number);
  printDialog.close();
  printMonths(calYear, calMonth, (ey - calYear) * 12 + (em - calMonth) + 1);
};

function printMonths(year, month, count) {
  const area = loadArea();
  const today = today0();
  let html = "";
  for (let i = 0; i < count; i++) {
    const y = year + Math.floor((month + i) / 12);
    const m = (month + i) % 12;
    html += `<section class="print-page">
      <div class="area-name">📍 ${esc(area.label)}</div>
      <div class="cal-head"><span class="title">${y}年${m + 1}月</span></div>
      ${calTableHtml(area, y, m, today)}
    </section>`;
  }
  document.getElementById("printRange").innerHTML = html;
  document.body.classList.add("print-multi");
  window.print();
}
// 印刷が終わったら通常表示に戻す(生成した数か月分のDOMも破棄する)
window.addEventListener("afterprint", () => {
  document.body.classList.remove("print-multi");
  document.getElementById("printRange").innerHTML = "";
});

/* =====================================================================
 * 分別辞典タブ (774品目・検索 + カテゴリ絞り込み)
 * ===================================================================== */
// 検索用の正規化: NFKC(全角英数→半角等) → 小文字 → ひらがな→カタカナ。
// 公式アプリは「大文字化+全角化+カタカナ化」で data-keyword と部分一致させて
// いるだけなので漢字品目は読みで探せないが、こちらは品目名の読み仮名(yomi)も
// 検索対象に含めており「でんち」→乾電池 のような検索ができる。
function toKatakana(s) {
  return s.replace(/[ぁ-ん]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
}
function normSearch(s) {
  return toKatakana(s.normalize("NFKC").toLowerCase());
}

function jitenMatches() {
  const q = normSearch(jitenQuery.trim());
  return APP_DATA.jiten.filter(it => {
    if (jitenCat && it.cat !== jitenCat) return false;
    if (!q) return true;
    return normSearch(it.name + " " + (it.yomi || "") + " " + it.kw).includes(q);
  });
}

function jitenListHtml() {
  const items = jitenMatches();
  if (!items.length) {
    return `<div class="jiten-count">該当する品目がありません</div>`;
  }
  let html = `<div class="jiten-count">${items.length}件</div>`;
  let lastKana = null;
  for (const it of items) {
    if (it.kana !== lastKana) {
      lastKana = it.kana;
      html += `<div class="kana-header">${esc(it.kana)}</div>`;
    }
    const cls = JITEN_CAT_CLASS[it.cat] || "cat-no";
    html += `<details class="acc">
      <summary>
        <span class="jiten-name">${esc(it.name)}</span>
        <span class="jiten-badge ${cls}">${esc(it.cat)}</span>
      </summary>
      <div class="acc-body">
        <div class="detail-label">分別区分</div>
        <div><span class="jiten-badge ${cls}">${esc(it.cat)}</span></div>
        ${it.note ? `<div class="detail-label">注意事項</div><div class="rich">${esc(it.note)}</div>` : ""}
      </div>
    </details>`;
  }
  return html;
}

function renderJiten() {
  let html = headerHtml(false) + `
    <div class="search-box">

function contactEntriesHtml(entries) {
  return entries.map(e => `<div class="card">
    ${e.title ? `<div class="contact-title">${esc(e.title)}</div>` : ""}
    ${e.org ? `<div class="contact-org">${esc(e.org)}</div>` : ""}
    ${e.fields.map(f =>
      `<div class="detail-label">${esc(f.label)}</div><div class="rich">${f.html}</div>`
    ).join("")}
  </div>`).join("");
}

function renderMenuPage(page) {
  let html = headerHtml(false) + backLinkHtml();

  if (page === "faq") {
    html += `<div class="page-title">よくある質問</div>`;
    let lastCat = null;
    for (const f of APP_DATA.faq) {
      if (f.cat !== lastCat) {
        lastCat = f.cat;
        html += `<div class="section-title">${esc(f.cat)}</div>`;
      }
      html += `<details class="acc">
        <summary><span class="jiten-name">${esc(f.q)}</span></summary>
        <div class="acc-body rich">${f.a}</div>
      </details>`;
    }
  } else {
    const data = APP_DATA.contacts[page];
    html += `<div class="page-title">${esc(data.title)}</div>`;
    for (const sec of data.sections) {
      if (sec.label) html += `<div class="section-title">${esc(sec.label)}</div>`;
      html += contactEntriesHtml(sec.entries);
    }
    if (page === "sodai") {
      html += `<div class="snapshot-note">インターネット申込は
        <a href="https://ecolife.e-tumo.jp/toshima-sodai-u/" target="_blank" rel="noopener">粗大ごみ受付センター(外部サイト)</a>
        から。</div>`;
    }
  }

  html += footerHtml();
  app.innerHTML = html;
  bindHeader();
  bindBack();
}

/* ---------- 起動 ---------- */
(async function init() {
  applyTheme();
  // 「自動」設定のままOS側のモードが変わったときに追従する
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
    if (currentTheme() === "auto") applyTheme();
  });
  try {
    // no-cache: CDNキャッシュの古いデータを掴まないよう毎回サーバに再検証させる
    const res = await fetch("toshima-gomi.json", { cache: "no-cache" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    DATA = await res.json();
  } catch (e) {
    // file:// で直接開いた場合など。fetch はローカルファイル直開きでは動かない
    app.innerHTML = `<div class="card" style="margin-top:24px">
      <b>収集データ (toshima-gomi.json) を読み込めませんでした。</b>
      <div style="margin-top:8px;font-size:13px;color:var(--sub)">
        ローカルで確認する場合は、このフォルダで
        <code>python3 -m http.server 8000</code> を実行して
        <code>http://localhost:8000</code> を開いてください
        (ブラウザで index.html を直接開くと fetch が制限されます)。<br>
        エラー: ${esc(e.message)}
      </div></div>`;
    return;
  }
  const t = today0();
  calYear = t.getFullYear();
  calMonth = t.getMonth();
  render();
})();
</script>
