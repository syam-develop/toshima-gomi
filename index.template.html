<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="豊島区のごみ収集日を、住んでいる地域ごとに確認できる非公式のカレンダーです。収集する曜日・月間カレンダー・分別辞典をまとめて見られます。">
<!-- ヘッダーの帯と同じ色。applyTheme() がテーマに合わせて書き換える -->
<meta name="theme-color" content="#0c7f72" id="themeColor">
<!-- iPhone の Safari で、画面上部に iOS版のバナー(Apple 標準の Smart App Banner)を出す -->
<meta name="apple-itunes-app" content="app-id=6797180484">
<link rel="icon" type="image/png" href="app-icon.png">
<link rel="apple-touch-icon" href="app-icon.png">
<title>豊島区ごみ収集カレンダー(非公式)</title>
<!-- ?area= 付きで開かれても(町名ページから来たとき)、検索エンジンにはこの URL 1つとして扱わせる -->
<link rel="canonical" href="https://syam-develop.github.io/toshima-gomi/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="豊島区ごみ収集カレンダー">
<meta property="og:title" content="豊島区ごみ収集カレンダー(非公式)">
<meta property="og:description" content="豊島区のごみ収集日を、住んでいる地域ごとに確認できる非公式のカレンダーです。収集する曜日・月間カレンダー・分別辞典をまとめて見られます。">
<meta property="og:url" content="https://syam-develop.github.io/toshima-gomi/">
<meta property="og:image" content="https://syam-develop.github.io/toshima-gomi/app-icon.png">
<style>
  /* =====================================================================
   * デザイン「集積所の看板」
   * アプリアイコン(ティールの地・生成りのごみ箱・太い墨色の輪郭)を下敷きに、
   * ごみ集積所の看板のような、太い輪郭の板と品目色の帯で組む。
   * 主役は品目の4色。それ以外の色は墨・生成り・ティールに絞る。
   * フォントは端末に入っているものだけを使う(Web フォントは読み込まない。
   * 日本語フォントは重いうえ、外部サーバーへの通信が発生するため)。
   * Windows では区の資料でも使われる BIZ UDPゴシック、Apple 端末ではヒラギノになる。
   * ===================================================================== */
  :root {
    --ground: #efe7da;     /* ページの地 */
    --plate: #fbf7ef;      /* 板(カード)の地 */
    --text: #2f2c28;       /* 文字 */
    --outline: #2f2c28;    /* 板の太い輪郭 */
    --sub: #6a6358;        /* 補足の文字 */
    --rule: #ddd3c3;       /* 板の中の細い区切り線 */
    --brand: #0c7f72;      /* ヘッダーの帯・選択中のタブ */
    --on-brand: #fbf7ef;
    --today: #f3e1c0;      /* 今日の行・マス */
    --sat: #2462a8;
    --sun: #b23d19;
    /* 品目色: --c-* は白文字を載せる塗り、--x-* は地の上に置く文字色 */
    --c-burnable: #c8461f; --x-burnable: #a93a18;
    --c-bottle: #1e7a45;   --x-bottle: #1e7a45;
    --c-paper: #2462a8;    --x-paper: #2462a8;
    --c-metal: #6d48ad;    --x-metal: #6d48ad;
    --c-sodai: #8f5e0f;    --x-sodai: #8f5e0f;
    --c-kyoten: #0b766a;   --x-kyoten: #0b766a;
    --c-no: #7a4a2a;       --x-no: #7a4a2a;
    --bw: 3px;             /* 板の輪郭の太さ */
  }
  /* ダークでも品目の塗り(--c-*)は同じ色のまま。白文字が載るので暗い地でも読める */
  :root[data-theme="dark"] {
    --ground: #1c1b18;
    --plate: #272520;
    --text: #eee7d9;
    --outline: #6c6457;
    --sub: #aba394;
    --rule: #3b382f;
    --brand: #0d6e63;
    --on-brand: #f3ede1;
    --today: #3d3224;
    --sat: #86b8f2;
    --sun: #ff9c7a;
    --x-burnable: #ff9c7a; --x-bottle: #6bcb94; --x-paper: #86b8f2; --x-metal: #c2a8ee;
    --x-sodai: #e0b45e;    --x-kyoten: #4fd1c1; --x-no: #d9a07c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Meiryo", sans-serif;
    -webkit-font-smoothing: antialiased;
    background: var(--ground);
    color: var(--text);
    line-height: 1.5;
    /* 下部タブバーのぶん(PC ではタブバーを出さないので 0 に戻す) */
    padding-bottom: calc(78px + env(safe-area-inset-bottom));
  }
  button { font-family: inherit; color: inherit; cursor: pointer; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
  /* 改行してよい位置で区切った語句。日本語はどの文字の間でも折り返すため、
     「プラスチ|ック」のような改行を防ぐ。Safari が word-break: auto-phrase に
     対応していないので、区切りは phrases() で手で入れている */
  .ph { display: inline-block; }

  /* 品目クラスを付けると --c(塗り)/ --x(文字色)が決まる */
  .burnable          { --c: var(--c-burnable); --x: var(--x-burnable); }
  .bottleCanPet      { --c: var(--c-bottle);   --x: var(--x-bottle); }
  .paperPlastic      { --c: var(--c-paper);    --x: var(--x-paper); }
  .metalCeramicGlass { --c: var(--c-metal);    --x: var(--x-metal); }
  .cat-sodai         { --c: var(--c-sodai);    --x: var(--x-sodai); }
  .cat-kyoten        { --c: var(--c-kyoten);   --x: var(--x-kyoten); }
  .cat-no            { --c: var(--c-no);       --x: var(--x-no); }

  /* ── ヘッダーの帯 ── */
  .topbar {
    background: var(--brand); color: var(--on-brand);
    border-bottom: var(--bw) solid var(--outline);
    padding-top: env(safe-area-inset-top);
  }
  .topbar-inner {
    max-width: 760px; margin: 0 auto; padding: 10px 16px;
    display: flex; align-items: center; gap: 10px;
  }
  .brand-icon {
    width: 36px; height: 36px; border-radius: 9px; flex: none;
    border: 2px solid var(--outline);
  }
  .brand { flex: 1; min-width: 0; }
  .brand-title {
    font-size: 17px; font-weight: 700; line-height: 1.3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .topnav { display: none; }
  .theme-btn {
    flex: none; height: 44px; padding: 0 14px; border-radius: 999px;
    border: 2px solid var(--on-brand); background: transparent; color: var(--on-brand);
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 700; white-space: nowrap;
  }
  .theme-btn svg { width: 18px; height: 18px; flex: none; }
  /* スマホではアイコンだけにしてタイトルを切らさない(状態は aria-label で伝える) */
  .theme-btn .tl { display: none; }
  .theme-btn { width: 44px; padding: 0; justify-content: center; }

  /* ── 下部タブバー(スマホ・タブレット) ── */
  #tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--plate); border-top: var(--bw) solid var(--outline);
    padding-bottom: env(safe-area-inset-bottom);
  }
  #tabbar .inner { max-width: 760px; margin: 0 auto; display: flex; padding: 6px 4px; }
  #tabbar button {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    border: none; background: none; padding: 0;
    color: var(--sub); font-size: 11px; font-weight: 700;
  }
  #tabbar .ti {
    width: 56px; height: 32px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
  }
  #tabbar .ti svg { width: 22px; height: 22px; }
  #tabbar button.on { color: var(--text); }
  #tabbar button.on .ti { background: var(--brand); color: var(--on-brand); }

  /* ── ページの枠 ── */
  .wrap {
    max-width: 760px; margin: 0 auto; padding: 16px 16px 28px;
    display: flex; flex-direction: column; gap: 16px;
  }
  /* カレンダー以外の画面は、PC でも読みやすい幅に収める */
  .narrow { width: 100%; max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .narrow.wide { max-width: 1280px; }
  .page-title { font-size: 20px; font-weight: 700; line-height: 1.4; }
  .page-sub { display: block; font-size: 13px; font-weight: 700; color: var(--sub); }
  .section-title { font-size: 15px; font-weight: 700; color: var(--sub); margin-top: 6px; }

  /* ── 板(看板) ── */
  .plate {
    background: var(--plate); border: var(--bw) solid var(--outline);
    border-radius: 16px; overflow: hidden;
  }
  .plate-head {
    padding: 10px 16px; font-size: 15px; font-weight: 700; line-height: 1.5;
    border-bottom: var(--bw) solid var(--outline);
  }
  .card {
    background: var(--plate); border: 2px solid var(--outline);
    border-radius: 14px; padding: 14px 16px;
  }

  /* ── ボタン ── */
  .pill-btn {
    height: 44px; padding: 0 16px; border-radius: 999px;
    border: 2px solid var(--outline); background: var(--plate); color: var(--text);
    font-size: 14px; font-weight: 700; white-space: nowrap;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex: none;
  }
  .pill-btn svg { width: 18px; height: 18px; flex: none; }
  .circle-btn {
    width: 44px; height: 44px; border-radius: 50%; padding: 0; flex: none;
    border: 2px solid var(--outline); background: var(--plate); color: var(--text);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .circle-btn svg { width: 20px; height: 20px; }
  .back-link {
    align-self: flex-start; height: 44px; padding: 0 4px;
    display: inline-flex; align-items: center; gap: 4px;
    border: none; background: none; font-size: 15px; font-weight: 700;
  }
  .back-link svg { width: 18px; height: 18px; }
  @media (hover: hover) {
    .pill-btn:hover, .circle-btn:hover, .opt-grid button:hover,
    .opt-list button:hover, .menu-list button:hover { background: var(--ground); }
  }

  /* ── カレンダー画面の配置 ──
     スマホ: 地域 → 今日(次)の収集 → カレンダー → 収集する曜日 の1列。
     PC: 左に地域・今日の収集・収集する曜日、右にカレンダーの2列。
     DOM は PC の並びで組み、スマホでは .cal-side を display: contents に
     して中身を1列に並べ替える */
  .cal-layout { display: flex; flex-direction: column; gap: 16px; }
  .cal-side { display: contents; }
  .area-row { order: 1; }
  .hero { order: 2; }
  .cal-main { order: 3; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .weekly { order: 4; }

  .area-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .area-label {
    flex: 1; min-width: 0; display: flex; align-items: flex-start; gap: 6px;
    font-size: 16px; font-weight: 700; line-height: 1.45;
  }
  .area-label svg { width: 20px; height: 20px; flex: none; margin-top: 1px; }

  /* 今日(または次)の収集の看板 */
  .hero .bands { display: flex; flex-direction: column; }
  .hero .band {
    display: flex; align-items: center; gap: 14px;
    padding: 20px 16px; background: var(--c); color: #fff;
  }
  .hero .band + .band { border-top: 2px solid var(--outline); }
  .hero .disc {
    width: 62px; height: 62px; border-radius: 50%; flex: none;
    background: #fbf7ef; color: var(--c); border: var(--bw) solid var(--outline);
    display: flex; align-items: center; justify-content: center;
  }
  .hero .disc svg { width: 32px; height: 32px; }
  .hero .name { font-size: 34px; font-weight: 700; line-height: 1.25; min-width: 0; }
  .hero .name.mid { font-size: 28px; }
  .hero .name.long { font-size: 24px; }
  .hero .foot {
    display: flex; align-items: center; gap: 8px; padding: 12px 16px;
    border-top: var(--bw) solid var(--outline); font-size: 17px; font-weight: 700;
  }
  .hero .foot svg { width: 22px; height: 22px; flex: none; }

  /* 収集する曜日の看板 */
  .weekly { display: flex; flex-direction: column; }
  .wk-row { display: flex; align-items: stretch; }
  .wk-row + .wk-row { border-top: 2px solid var(--outline); }
  .wk-day {
    width: 104px; flex: none; padding: 10px 12px;
    border-right: 2px solid var(--outline);
    display: flex; flex-direction: column; justify-content: center;
    font-size: 19px; font-weight: 700; line-height: 1.3;
  }
  .wk-day small { font-size: 12px; }
  .wk-cat {
    flex: 1; min-width: 0; padding: 11px 12px; background: var(--c); color: #fff;
    display: flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 700; line-height: 1.4;
  }
  .wk-cat svg { width: 20px; height: 20px; flex: none; }

  /* カレンダーの操作部分。スマホでは切り替えを上、月の移動を下に置く */
  .cal-tools { display: flex; flex-direction: column; gap: 12px; }
  .cal-tools .seg { order: -1; }
  .cal-title { display: none; font-size: 22px; font-weight: 700; }
  .seg {
    display: flex; border: var(--bw) solid var(--outline); border-radius: 999px;
    overflow: hidden; background: var(--plate);
  }
  .seg button {
    flex: 1; height: 44px; border: none; background: transparent;
    font-size: 15px; font-weight: 700;
  }
  .seg button.on { background: var(--text); color: var(--plate); }
  /* 幅360pxほどの狭い端末では、今日へ・印刷が次の行の右端に回る */
  .cal-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; row-gap: 8px; }
  .cal-head .title { font-size: 18px; font-weight: 700; white-space: nowrap; }
  .cal-head .tools { margin-left: auto; display: flex; gap: 6px; }
  .cal-head .tools .pill-btn { padding: 0 12px; }
  /* スマホでは印刷ボタンをアイコンだけにして1行に収める */
  .print-btn { width: 44px; padding: 0; }
  .print-label { display: none; }

  /* 2週間の予定 */
  .sched-row {
    display: flex; align-items: center; gap: 10px; padding: 11px 14px;
    border-top: 1.5px solid var(--rule);
  }
  .sched-row:first-child { border-top: none; }
  .sched-row.is-today { background: var(--today); }
  .sched-date { width: 86px; flex: none; font-size: 18px; font-weight: 700; white-space: nowrap; }
  .sched-date .wd { font-size: 13px; color: var(--sub); }
  .sched-date .wd.sat { color: var(--sat); }
  .sched-date .wd.sun { color: var(--sun); }
  .sched-items { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .sched-none { font-size: 14px; color: var(--sub); }
  .tag {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 700; line-height: 1.35; color: var(--x);
  }
  .tag .sq {
    width: 26px; height: 26px; border-radius: 7px; flex: none;
    background: var(--c); color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .tag .sq svg { width: 16px; height: 16px; }
  .today-pill {
    flex: none; font-size: 12px; font-weight: 700; line-height: 1.4;
    padding: 3px 9px; border-radius: 999px; background: var(--text); color: var(--plate);
  }

  /* 月間カレンダー */
  table.cal { width: 100%; border-collapse: collapse; table-layout: fixed; }
  table.cal th {
    font-size: 13px; font-weight: 700; padding: 8px 0;
    border-bottom: var(--bw) solid var(--outline);
  }
  table.cal th.sun { color: var(--sun); }
  table.cal th.sat { color: var(--sat); }
  /* height は最低値。PC では fitCalendar() が表全体の高さを入れ、行が均等に伸びる */
  table.cal td {
    vertical-align: top; text-align: center; height: 76px; padding: 4px 3px;
    border-top: 1.5px solid var(--rule); border-right: 1.5px solid var(--rule);
  }
  table.cal tbody tr:first-child td { border-top: none; }
  table.cal td:last-child { border-right: none; }
  table.cal td .d {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 24px; height: 24px; padding: 0 5px; border-radius: 999px;
    font-size: 13px; font-weight: 700;
  }
  table.cal td.sun .d { color: var(--sun); }
  table.cal td.sat .d { color: var(--sat); }
  /* 前後の月の日: 日付・収集予定とも出すが、薄くして参考扱いとわかるように */
  table.cal td.other { opacity: .42; }
  table.cal td.today { background: var(--today); }
  table.cal td.today .d { background: var(--text); color: var(--plate); }
  .cal-item {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    margin-top: 4px; padding: 4px 2px 5px; border-radius: 7px;
    background: var(--c); color: #fff; text-align: center;
  }
  .cal-item svg { width: 15px; height: 15px; flex: none; }
  .cal-item .cl { font-size: 10px; font-weight: 700; line-height: 1.25; }
  /* マスには短い名前を出す(正式名は同じ画面の「収集する曜日」にある)。
     正式名は印刷用。紙には「収集する曜日」が載らないため */
  .cl-full { display: none; }

  /* ── 地域選択 ── */
  .opt-grid { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px; }
  .opt-grid button {
    min-height: 44px; padding: 8px 16px; border-radius: 12px;
    border: 2px solid var(--outline); background: var(--plate);
    font-size: 15px; font-weight: 700;
  }
  .opt-list { display: flex; flex-direction: column; gap: 8px; padding: 14px; }
  .opt-list button {
    padding: 12px 14px; border-radius: 12px; text-align: left; line-height: 1.5;
    border: 2px solid var(--outline); background: var(--plate); font-size: 15px;
  }
  .opt-list button .zone-note { display: block; font-size: 12px; color: var(--sub); margin-top: 3px; }

  /* ── 開閉する項目(details) ── */
  details.acc {
    background: var(--plate); border: 2px solid var(--outline);
    border-radius: 12px; overflow: hidden;
  }
  details.acc > summary {
    list-style: none; cursor: pointer; min-height: 48px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 11px 14px; font-size: 15px; font-weight: 700; line-height: 1.45;
  }
  details.acc > summary::-webkit-details-marker { display: none; }
  details.acc > summary::after {
    content: ""; flex: none; width: 8px; height: 8px; margin-left: 2px;
    border-right: 2.5px solid var(--text); border-bottom: 2.5px solid var(--text);
    transform: rotate(45deg); transition: transform .15s;
  }
  details.acc[open] > summary::after { transform: rotate(-135deg); }
  details.acc .acc-body {
    padding: 12px 14px 14px; font-size: 14px; line-height: 1.7;
    border-top: 1.5px solid var(--rule);
  }
  .rich { word-break: break-word; }
  .rich a { color: var(--text); }
  .acc-list { display: flex; flex-direction: column; gap: 8px; }

  /* ── 分別辞典 ── */
  .search-box {
    display: flex; align-items: center; gap: 10px;
    background: var(--plate); border: var(--bw) solid var(--outline);
    border-radius: 14px; padding: 10px 14px;
  }
  .search-box svg { width: 20px; height: 20px; flex: none; }
  .search-box input {
    flex: 1; min-width: 0; border: none; background: none; color: var(--text);
    font-size: 16px; font-family: inherit; outline: none;
  }
  .search-box:focus-within { outline: 3px solid var(--text); outline-offset: 2px; }
  .cat-chips {
    display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 6px;
    -webkit-overflow-scrolling: touch;
  }
  .cat-chips button {
    flex: none; height: 38px; padding: 0 14px; border-radius: 999px;
    border: 2px solid var(--outline); background: var(--plate);
    font-size: 13px; font-weight: 700; white-space: nowrap;
  }
  .cat-chips button.on { background: var(--text); color: var(--plate); }
  .jiten-list { display: flex; flex-direction: column; gap: 8px; }
  .jiten-count { font-size: 13px; color: var(--sub); }
  .kana-header {
    font-size: 15px; font-weight: 700; padding: 10px 2px 2px;
    border-bottom: 2px solid var(--outline);
  }
  .jiten-badge {
    flex: none; font-size: 11px; font-weight: 700; line-height: 1.4;
    padding: 3px 8px; border-radius: 6px; background: var(--c); color: #fff;
    white-space: nowrap;
  }
  .jiten-name { flex: 1; min-width: 0; }
  .detail-label { font-size: 12px; font-weight: 700; color: var(--sub); margin: 8px 0 3px; }
  .detail-label:first-child { margin-top: 0; }

  /* ── 便利帳 ── */
  .benri-img { width: 100%; border-radius: 8px; display: block; }
  .benri-links { margin-top: 10px; font-size: 13px; }
  .benri-links a { word-break: break-all; }

  /* ── メニュー ── */
  .menu-list { display: flex; flex-direction: column; gap: 8px; }
  .menu-list button {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    min-height: 56px; padding: 12px 16px; border-radius: 14px; text-align: left;
    border: var(--bw) solid var(--outline); background: var(--plate);
    font-size: 16px; font-weight: 700; line-height: 1.45;
  }
  .menu-list button::after {
    content: ""; flex: none; width: 9px; height: 9px;
    border-right: 2.5px solid var(--text); border-bottom: 2.5px solid var(--text);
    transform: rotate(-45deg);
  }
  .menu-list .menu-note { display: block; font-size: 12px; font-weight: 400; color: var(--sub); margin-top: 2px; }
  .contact-title { font-size: 16px; font-weight: 700; }
  .contact-org { font-size: 13px; color: var(--sub); margin-top: 1px; }
  .snapshot-note {
    font-size: 13px; line-height: 1.7; padding: 12px 14px;
    border: 2px dashed var(--outline); border-radius: 12px;
  }

  /* ── ページ下部: アプリへの案内と注意書き ── */
  .site-foot {
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    padding-top: 8px; text-align: center;
  }
  .promo {
    display: flex; align-items: center; gap: 18px;
    background: var(--plate); border: var(--bw) solid var(--outline); border-radius: 16px;
    padding: 10px 12px 10px 20px;
  }
  .promo-link {
    display: flex; align-items: center; gap: 16px; text-decoration: none;
  }
  .promo-title { font-size: 16px; font-weight: 700; white-space: nowrap; }
  .promo-icon {
    display: block; width: 52px; height: 52px; border-radius: 12px; flex: none;
    border: 2px solid var(--outline);
  }
  /* QR はマウスで操作する端末(PC)だけ。スマホでは自分の画面の QR を読めない。
     PC でもウィンドウが狭いと札が横にはみ出すので、幅に余裕があるときだけ */
  .promo-qr {
    display: none; width: 92px; height: 92px; flex: none;
    border: 2px solid var(--outline); border-radius: 8px; background: #fff;
  }
  @media (hover: hover) and (pointer: fine) and (min-width: 600px) {
    .promo-qr { display: block; }
  }
  .legal { font-size: 12px; line-height: 1.8; color: var(--sub); }
  .legal a { color: var(--text); }
  /* 町名別・分別辞典などの静的ページ(pages.py が書き出す)へのリンク。検索エンジンが
     ここからたどれるよう、本体のどの画面の下にも出す */
  .foot-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 16px; }

  /* ── タブレット以上 ── */
  @media (min-width: 700px) {
    .brand-title { font-size: 19px; }
    .theme-btn { width: auto; padding: 0 14px; }
    .theme-btn .tl { display: inline; }
    .cal-head { gap: 8px; }
    .cal-head .tools { gap: 8px; }
    .cal-head .tools .pill-btn { padding: 0 16px; }
    .print-btn { width: auto; padding: 0 16px; }
    .print-label { display: inline; }
    .cal-head .title { font-size: 22px; }
    table.cal th { font-size: 14px; padding: 10px 0; }
    table.cal td { height: 96px; padding: 7px; text-align: left; }
    table.cal td .d { font-size: 15px; min-width: 28px; height: 28px; padding: 0 6px; }
    .cal-item {
      flex-direction: row; align-items: center; text-align: left;
      gap: 6px; margin-top: 6px; padding: 6px 7px; border-radius: 8px;
    }
    .cal-item .cl { font-size: 12px; line-height: 1.3; }
    .page-title { font-size: 24px; }
    .cat-chips { flex-wrap: wrap; overflow: visible; }
  }

  /* ── PC: 上にメニュー、カレンダー画面は2列 ── */
  @media (min-width: 1024px) {
    body { padding-bottom: 0; }
    #tabbar { display: none; }
    .topbar-inner { max-width: 1680px; padding: 12px 40px; gap: 14px; }
    .brand-icon { width: 42px; height: 42px; border-radius: 11px; }
    .brand { flex: none; }
    .topnav { display: flex; gap: 6px; margin-left: auto; }
    .topnav button {
      height: 44px; padding: 0 18px; border-radius: 999px;
      border: 2px solid transparent; background: none; color: var(--on-brand);
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 15px; font-weight: 700;
    }
    .topnav button svg { width: 20px; height: 20px; }
    .topnav button.on { background: var(--plate); color: var(--text); border-color: var(--outline); }
    .wrap { max-width: 1680px; padding: 28px 40px 40px; gap: 24px; }

    .cal-layout { flex-direction: row; align-items: stretch; gap: 28px; }
    .cal-side { display: flex; flex-direction: column; gap: 16px; flex: 0 1 420px; min-width: 340px; }
    .cal-main { flex: 1 1 0; }
    /* 右のカレンダーが高いときは、左の看板2枚が伸びて下端を揃える */
    .cal-side .hero, .cal-side .weekly { flex: 1 1 auto; display: flex; flex-direction: column; }
    .hero .bands { flex: 1; }
    .hero .band { flex: 1; }
    .wk-row { flex: 1; }

    .cal-tools { flex-direction: row; align-items: center; flex-wrap: wrap; }
    .cal-tools .seg { order: 0; margin-left: auto; }
    .seg button { flex: none; width: 108px; }
    .cal-title { display: block; }
    .cal-head .title { font-size: 26px; }
    .cal-head .tools { margin-left: 8px; }

    .jiten-list, .acc-grid, .menu-list {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: start; gap: 8px 12px;
    }
    .jiten-count, .kana-header { grid-column: 1 / -1; }
  }

  /* ── 大きな画面では文字も一段大きく ── */
  @media (min-width: 1500px) {
    .cal-side { flex-basis: 480px; }
    .hero .disc { width: 78px; height: 78px; }
    .hero .disc svg { width: 40px; height: 40px; }
    .hero .name { font-size: 44px; }
    .hero .name.mid { font-size: 36px; }
    .hero .name.long { font-size: 32px; }
    .hero .foot { font-size: 19px; }
    .wk-day { font-size: 22px; width: 116px; }
    .wk-cat { font-size: 17px; }
    .cal-head .title { font-size: 30px; }
    table.cal th { font-size: 15px; }
    table.cal td { padding: 9px; }
    table.cal td .d { font-size: 17px; min-width: 32px; height: 32px; }
    .cal-item { padding: 8px 9px; }
    .cal-item svg { width: 18px; height: 18px; }
    .cal-item .cl { font-size: 14px; }
  }

  /* ── 範囲印刷のダイアログ ── */
  #printDialog {
    border: var(--bw) solid var(--outline); border-radius: 16px;
    background: var(--plate); color: var(--text);
    padding: 20px; width: min(360px, calc(100vw - 48px));
    font-family: inherit;
    /* 全称セレクタの margin:0 リセットが UA の中央寄せ(margin:auto)を
       打ち消してしまうため明示的に戻す */
    margin: auto;
  }
  #printDialog::backdrop { background: rgba(0, 0, 0, .45); }
  .dlg-title { font-size: 17px; font-weight: 700; margin-bottom: 14px; }
  .dlg-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 15px; font-weight: 700; }
  #printUntil {
    font-size: 15px; font-weight: 700; font-family: inherit;
    height: 44px; padding: 0 10px; border-radius: 10px;
    border: 2px solid var(--outline); background: var(--plate); color: var(--text);
  }
  .dlg-note { font-size: 13px; color: var(--sub); margin-top: 10px; }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .dlg-actions .primary { background: var(--text); color: var(--plate); }
  /* 印刷専用コンテナは画面には出さない */
  #printRange { display: none; }

  /* ── 印刷: カレンダー(または表示中のリスト)だけを紙に出す ──
     ダークモード中でも紙は白なので、印刷時はライト配色を強制する */
  /* 印刷CSSの寸法計算は「余白10mm」を前提にしているため、ここで固定する
     (ブラウザ既定の余白は環境によりまちまちで、広いと表が次ページに割れる) */
  @page { margin: 10mm; }
  @media print {
    :root, :root[data-theme="dark"] {
      --ground: #fff; --plate: #fff; --text: #1a1a1a; --outline: #1a1a1a;
      --sub: #555; --rule: #bbb; --today: #fff;
      --sat: #2264ad; --sun: #b23d19;
      --x-burnable: #a93a18; --x-bottle: #1e7a45; --x-paper: #2462a8; --x-metal: #6d48ad;
    }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { background: #fff; padding: 0; }
    .topbar, #tabbar, .hero, .weekly, .seg, .site-foot, .cal-title,
    .cal-head .circle-btn, .cal-head .tools, .area-row .pill-btn, .today-pill { display: none !important; }
    .wrap { max-width: none; padding: 0; display: block; }
    .cal-layout, .cal-side, .cal-main, .cal-tools { display: block; }
    .area-row { margin-bottom: 3mm; }
    .area-label { font-size: 10pt; }
    .area-label svg { width: 4mm; height: 4mm; }
    .cal-head { justify-content: center; margin-bottom: 4mm; }
    .cal-head .title { font-size: 14pt; }
    .plate { border: none; border-radius: 0; background: none; overflow: visible; }

    /* 印刷時のカレンダー寸法は画面用(大きな画面向けの拡大指定を含む)を上書きする。
       テーブル自体に「A4の印刷可能領域からヘッダー分を引いた高さ」をmm指定する
       ことで、行が均等に引き伸ばされて用紙いっぱいに印刷される。
       (縦長→A4縦: 277mm−ヘッダー≈17mm → 252mm / 横長→A4横: 190mm−17mm → 166mm) */
    /* fitCalendar() が画面用にインラインstyleで高さを入れるため、
       印刷時は !important で用紙サイズの高さを優先させる。
       高さは下の orientation メディアクエリで用紙の向きに合わせて決まる */
    table.cal { page-break-inside: avoid; }
    table.cal td { height: auto; padding: 1.5mm 1mm; text-align: center; }
    table.cal td .d { font-size: 12pt; min-width: 0; height: auto; padding: 0; }
    table.cal th { font-size: 10pt; padding: 1.5mm 0; }
    /* 紙のカレンダーらしく全セルに罫線を引く */
    table.cal td, table.cal th { border: 0.5pt solid #999; }
    /* 紙では塗りつぶしをやめ、淡い色の地に品目色の文字にしてインクを節約する */
    .cal-item {
      flex-direction: column; align-items: center; text-align: center;
      padding: 1mm 0.6mm 1.2mm; margin-top: 1mm; gap: 0.5mm; border-radius: 1.5mm;
      background: color-mix(in srgb, var(--c) 14%, #fff); color: var(--c);
    }
    .cal-item svg { width: 4.5mm; height: 4.5mm; }
    .cal-item .cl { font-size: 8pt; }
    .cl-short { display: none; }
    .cl-full { display: block; }

    /* 「今日」の印は印刷しない(月をまたいで使う紙なので意味を持たない) */
    table.cal td.today { background: none; }
    table.cal td.today .d { background: none; color: inherit; }
    table.cal td.sun .d { color: var(--sun); }
    table.cal td.sat .d { color: var(--sat); }
    .sched-row.is-today { background: none; }

    /* 範囲印刷(印刷ボタンで月数を指定した場合): 画面の内容の代わりに
       #printRange に生成した各月のカレンダーを1か月1枚で印刷する */
    body.print-multi #app { display: none !important; }
    body.print-multi #printRange { display: block; }
    .print-page { page-break-after: always; }
    .print-page:last-child { page-break-after: auto; }
    .print-page .area-name { font-size: 10pt; margin-bottom: 3mm; }
    .print-page .cal-head { display: flex; }
  }
  /* 印刷設定で選んだ用紙の向きに追従して、どちらでも1枚いっぱいに広げる。
     印刷時のメディアクエリは「用紙」の縦横で評価される。
     (A4・余白10mm想定: 縦=277mm、横=190mm からヘッダー分を引いた高さ)
     テーブルの余り高さは内容の多い行ほど多く配分されてしまい、収集のない
     週がぺしゃんこになるため、各セルにも「(テーブル高さ − 曜日行) ÷ 週数」
     の均等な高さを指定して全行を同じ高さに揃える。週数(4〜6)は
     calTableHtml() がテーブルの style="--weeks:n" で渡してくる。 */
  @media print and (orientation: portrait) {
    table.cal { height: 252mm !important; }
    table.cal td { height: calc(242mm / var(--weeks, 5)); }
  }
  @media print and (orientation: landscape) {
    table.cal { height: 166mm !important; }
    table.cal td { height: calc(156mm / var(--weeks, 5)); }
  }
</style>
</head>

<!-- 範囲印刷: 印刷ボタンから開く「いつまで印刷するか」の選択ダイアログ -->

<!-- 範囲印刷時だけ使う印刷専用コンテナ(printMonths() が各月を生成する) -->
<div id="printRange"></div>

<script>
"use strict";

/* =====================================================================
 * 収集曜日データ (toshima-gomi.json。crawl.py が公式の収集日カレンダーから
 * 作る。取得日は DATA.meta.fetchedAt)
 * 出典: さんあ～る (manage.delight-system.com/threeR)
 * ここには埋め込まず、起動時に同じディレクトリの toshima-gomi.json を fetch で
 * 読み込む (データ更新時は JSON を差し替えるだけで build.py 不要)。
 * ===================================================================== */
let DATA = null;

/* =====================================================================
 * 公式Webアプリ相当のコンテンツ (crawl.py で取得したスナップショット。
 * 取得日は APP_DATA.fetchedAt)
 * 出典: さんあ～る (manage.delight-system.com/threeR)
 *  - jiten:    分別辞典 774品目 {kana,name,cat,note,kw}
 *  - faq:      よくある質問 {cat,q,a(HTML)}
 *  - contacts: 粗大ごみ申込/家電等処分/食べきり協力店/お問い合わせ先
 *  - benri:    便利帳(分け方・出し方ポスター。img は build.py が benri/ に
 *              書き出した画像ファイルのパス。app-data.json では data URI)
 * 「区からのお知らせ」(台風・年末年始などの時事情報) は載せない。
 * スナップショットでは古い告知が残り続けるため、公式サイトへの誘導に任せる。
 * ===================================================================== */
const APP_DATA = /* __MASTER__ */ null;

/* ---------- 定数 ---------- */
// Date#getDay() は 0=日曜。データ側の曜日キーに合わせるためのマップ。
const WEEKDAY_KEYS = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
const WEEKDAY_JP = ["日", "月", "火", "水", "木", "金", "土"];
// 「収集する曜日」は月曜始まりで並べる(月・木 のように読めるように)
const WEEK_ORDER_MON = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"];

const CATEGORIES = {
  burnable:          { name: "燃やすごみ" },
  bottleCanPet:      { name: "びん・かん・ペットボトル" },
  paperPlastic:      { name: "段ボール・紙・布類/プラスチック" },
  metalCeramicGlass: { name: "金属・陶器・ガラスごみ" },
};
const CATEGORY_ORDER = ["burnable", "bottleCanPet", "paperPlastic", "metalCeramicGlass"];

// 正式名を、改行してよい位置で区切ったもの(看板・2週間の予定・印刷用)。
// 区切りごとに .ph(inline-block)で包み、語の途中で折り返さないようにする。
const CAT_PHRASES = {
  burnable:          ["燃やすごみ"],
  bottleCanPet:      ["びん・かん・", "ペットボトル"],
  paperPlastic:      ["段ボール・", "紙・布類/", "プラスチック"],
  metalCeramicGlass: ["金属・陶器・", "ガラスごみ"],
};
// 月間カレンダーのマス用の短い名前。正式名は同じ画面の「収集する曜日」に
// 出ているので、狭いマスでは短くして「・」の位置でだけ折り返す。
const CAL_PHRASES = {
  burnable:          ["燃やす", "ごみ"],
  bottleCanPet:      ["びん・", "かん・", "ペット"],
  paperPlastic:      ["紙・", "布・", "プラ"],
  metalCeramicGlass: ["金属・", "陶器・", "ガラス"],
};
// 「今日の収集」の看板で、名前の長さに応じて文字を小さくする
const NAME_SIZE = { burnable: "", bottleCanPet: "mid", paperPlastic: "long", metalCeramicGlass: "mid" };

// 品目アイコン(自前SVG・currentColorで文字色に追従)。
// 絵文字は環境で見た目が変わり意味も伝わりにくいためシルエットを描画している。
// bottleCanPet = びん+かん、paperPlastic = 段ボール箱+ペット容器の組み合わせ。

function applyTheme() {
  const t = currentTheme();
  const dark = t === "dark" ||
    (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  const mode = dark ? "dark" : "light";
  document.documentElement.dataset.theme = mode;

  const next = THEME_ORDER[(THEME_ORDER.indexOf(currentTheme()) + 1) % THEME_ORDER.length];

  applyTheme();
}

/* =====================================================================
 * 「第n ◯曜日」判定 — このアプリの計算の要
 *
 * 豊島区の収集表にある「第1・3」は、
 *   「その月に 1番目 / 3番目 に *来る* その曜日」
 * という意味であり、「その月の第n週」や ISO 週番号とは無関係。
 * 例: 月の1日が金曜なら、その日が「第1金曜」。カレンダー上の週の
 * 区切り(日曜始まり等)がどうであっても影響しない。
 *
 * したがって判定は日付だけで決まる:
 *   1〜7日  → その曜日として月内 1番目
 *   8〜14日 → 2番目
 *   15〜21日 → 3番目
 *   22〜28日 → 4番目
 *   29〜31日 → 5番目(豊島区に「第5」の収集は存在しないため、
 *              データの nth に 5 が入らず自然に収集なしとなる)
 * ===================================================================== */
function nthOccurrenceOfWeekday(date) {
  return Math.ceil(date.getDate() / 7);
}

/**
 * 公式カレンダーで収集が無いとされている日(年末年始など)か。
 * DATA.closedDates は "2026-12-31" 形式で、曜日のルールでは表せない区内共通の例外。
 * (|| [] は、公開直後に新しいページと古い toshima-gomi.json が組み合わさった場合の保険)
 */
function isClosedDate(date) {
  const pad = n => String(n).padStart(2, "0");
  const key = `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
  return (DATA.closedDates || []).includes(key);
}

/**
 * 指定エリア・指定日に収集される品目キーの配列を返す(表示順)。
 * burnable / bottleCanPet / paperPlastic は毎週(曜日配列)、
 * metalCeramicGlass のみ「第n曜日」指定。
 * 収集の無い日 (isClosedDate) は、曜日が合っていても空を返す。ホーム・カレンダー・
 * 印刷はすべてここを通るので、判定はこの1か所だけでよい。
 */
function collectionsOn(area, date) {
  if (isClosedDate(date)) return [];
  const wd = WEEKDAY_KEYS[date.getDay()];
  const result = [];
  for (const key of CATEGORY_ORDER) {
    if (key === "metalCeramicGlass") {
      const spec = area.metalCeramicGlass;
      if (spec.weekday === wd && spec.nth.includes(nthOccurrenceOfWeekday(date))) {
        result.push(key);
      }
    } else if (area[key].includes(wd)) {
      result.push(key);
    }
  }
  return result;
}

/* ---------- 日付ユーティリティ ---------- */
function today0() {
  const now = new Date();
  return new Date(now.getFullYear(), now.getMonth(), now.getDate());
}
function addDays(date, n) {
  return new Date(date.getFullYear(), date.getMonth(), date.getDate() + n);
}
function sameDay(a, b) {
  return a.getFullYear() === b.getFullYear() &&
         a.getMonth() === b.getMonth() &&
         a.getDate() === b.getDate();
}
function fmtDate(date) {
  return `${date.getMonth() + 1}月${date.getDate()}日(${WEEKDAY_JP[date.getDay()]})`;
}

/** 締切時刻。繁華街(downtown)エリアのみ朝7:30、それ以外は朝8:00。 */
function deadlineOf(area) {
  return area.zone === "downtown"
    ? DATA.meta.rules.deadlineDowntown
    : DATA.meta.rules.deadlineNormal;
}
/** "08:00" → "8:00"(データは2桁だが、画面では先頭の0を付けない) */
function fmtTime(hhmm) {
  return hhmm.replace(/^0(?=\d:)/, "");
}
function isPastDeadline(area) {
  const [h, m] = deadlineOf(area).split(":").map(Number);
  const now = new Date();
  return now.getHours() * 60 + now.getMinutes() >= h * 60 + m;
}

/** 「次に出せる」収集日。今日が収集日でも締切時刻を過ぎていれば翌日以降を探す
 *  (iOS版 nextCollection と同じ挙動)。 */
function nextCollection(area) {
  const today = today0();
  for (let i = 0; i < 60; i++) {
    const d = addDays(today, i);
    const items = collectionsOn(area, d);
    if (!items.length) continue;
    if (i === 0 && isPastDeadline(area)) continue;
    return { date: d, items };
  }
  return null;
}

/** "明日 8月6日(水)" のような相対表現つき日付 */
function fmtRelative(date) {
  const today = today0();
  if (sameDay(date, today)) return `今日 ${fmtDate(date)}`;
  if (sameDay(date, addDays(today, 1))) return `明日 ${fmtDate(date)}`;
  return fmtDate(date);
}

/* ---------- エスケープ ---------- */
function esc(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
/** 区切った語句を、それぞれ折り返さない単位(.ph)で包んで並べる */
function phrases(parts) {
  return parts.map(p => `<span class="ph">${esc(p)}</span>`).join("");
}

/* ---------- タブ(スマホは下部のタブバー、PC はヘッダーのメニュー) ---------- */
const tabButtons = document.querySelectorAll("[data-tab]");
function updateTabbar() {
  tabButtons.forEach(b => {
    const on = b.dataset.tab === tab;
    b.classList.toggle("on", on);
    if (on) b.setAttribute("aria-current", "page");
    else b.removeAttribute("aria-current");
  });
}
tabButtons.forEach(b =>
  b.onclick = () => {
    tab = b.dataset.tab;
    menuPage = null;
    render();
  });

function render() {
  if (!DATA) return; // toshima-gomi.json 読み込み完了前は何もしない
  updateTabbar();
  window.scrollTo(0, 0);
  if (tab === "cal") {
    if (!loadArea()) { renderSetup("town"); return; }
    renderCalView();
  } else if (tab === "jiten") {
    renderJiten();
  } else if (tab === "benri") {
    renderBenri();
  } else {
    renderMenu();
  }
}

/* =====================================================================
 * 地域選択フロー: 町名 → 丁目 → (番地条件があれば候補選択)
 * ===================================================================== */
function renderSetup(step, sel) {
  sel = sel || {};
  let body = "";

  if (step === "town") {
    const towns = [...new Set(DATA.areas.map(a => a.town))];
    // 地域を選び直す途中なら、カレンダーへ戻れるようにする
    if (loadArea()) body += `<button class="back-link" data-back="cal">${UI_ICONS.prev}カレンダーに戻る</button>`;
    body += `<section class="plate">
      <h1 class="plate-head">お住まいの町名を選んでください</h1>
      <div class="opt-grid">` +
      towns.map(t => `<button data-town="${esc(t)}">${esc(t)}</button>`).join("") +
      `</div></section>`;
  } else if (step === "chome") {
    const chomes = [...new Set(
      DATA.areas.filter(a => a.town === sel.town).flatMap(a => a.chome)
    )].sort((x, y) => x - y);
    body += `<button class="back-link" data-back="town">${UI_ICONS.prev}町名を選び直す</button>
      <section class="plate">
      <h1 class="plate-head">${esc(sel.town)}の丁目を選んでください</h1>
      <div class="opt-grid">` +
      chomes.map(c => `<button data-chome="${c}">${c}丁目</button>`).join("") +
      `</div></section>`;
  } else if (step === "banchi") {
    const cands = DATA.areas.filter(a =>
      a.town === sel.town && a.chome.includes(sel.chome));
    body += `<button class="back-link" data-back="chome">${UI_ICONS.prev}丁目を選び直す</button>
      <section class="plate">
      <h1 class="plate-head">${esc(sel.town)}${sel.chome}丁目の番地を選んでください</h1>
      <div class="opt-list">` +
      cands.map(a => {
        const cond = a.banchiCondition || "全域";
        const zone = a.zone === "downtown"
          ? `<span class="zone-note">繁華街エリア(締切 朝7:30)</span>` : "";
        return `<button data-area="${esc(a.id)}">${esc(cond)}${zone}</button>`;
      }).join("") +
      `</div></section>`;
  }

  app.innerHTML = `<div class="narrow">${body}</div>` + footerHtml();
  window.scrollTo(0, 0);

  app.querySelectorAll("[data-town]").forEach(b =>
    b.onclick = () => renderSetup("chome", { town: b.dataset.town }));
  app.querySelectorAll("[data-chome]").forEach(b =>
    b.onclick = () => {
      const chome = Number(b.dataset.chome);
      const cands = DATA.areas.filter(a =>
        a.town === sel.town && a.chome.includes(chome));
      if (cands.length === 1) {
        selectArea(cands[0].id);
      } else {
        renderSetup("banchi", { town: sel.town, chome });
      }
    });
  app.querySelectorAll("[data-area]").forEach(b =>
    b.onclick = () => selectArea(b.dataset.area));
  app.querySelectorAll("[data-back]").forEach(b =>
    b.onclick = () => b.dataset.back === "cal" ? render() : renderSetup(b.dataset.back, sel));
}

function selectArea(id) {
  localStorage.setItem(STORAGE_KEY, id);
  const t = today0();
  calYear = t.getFullYear();
  calMonth = t.getMonth();
  render();
}

/** 今日(締切前)の収集、なければ次の収集を、品目色の帯で大きく出す看板 */
function heroHtml(area, today) {
  const todayItems = collectionsOn(area, today);
  let head, items;
  if (todayItems.length && !isPastDeadline(area)) {
    head = `今日 ${fmtDate(today)}`;
    items = todayItems;
  } else {
    const next = nextCollection(area);
    if (!next) return "";
    head = `次の収集 ${fmtRelative(next.date)}`;
    items = next.items;
  }
  return `<section class="plate hero" aria-label="${esc(head)}">
    <div class="plate-head">${esc(head)}</div>
    <div class="bands">${items.map(k => `<div class="band ${k}">
      <span class="disc">${ICONS[k]}</span>
      <span class="name ${NAME_SIZE[k]}">${phrases(CAT_PHRASES[k])}</span>
    </div>`).join("")}</div>
    <div class="foot">${UI_ICONS.clock}<span>朝 ${esc(fmtTime(deadlineOf(area)))} までに出してください</span></div>
  </section>`;
}

/** 地域の収集する曜日を、集積所の看板のように1品目1段で並べる */
function weeklyHtml(area) {
  const dayName = key => WEEKDAY_JP[WEEKDAY_KEYS.indexOf(key)];
  const rows = CATEGORY_ORDER.map(k => {
    let day;
    if (k === "metalCeramicGlass") {
      const spec = area.metalCeramicGlass;
      day = `<small>${spec.nth.map(n => `第${n}`).join("・")}</small>${dayName(spec.weekday)}`;
    } else {
      const days = WEEK_ORDER_MON.filter(w => area[k].includes(w));
      if (!days.length) return "";
      day = days.map(dayName).join("・");
    }
    return `<div class="wk-row">
      <div class="wk-day">${day}</div>
      <div class="wk-cat ${k}">${ICONS[k]}<span>${phrases(CAT_PHRASES[k])}</span></div>
    </div>`;
  }).join("");
  return `<section class="plate weekly" aria-labelledby="weeklyTitle">
    <h2 class="plate-head" id="weeklyTitle">収集する曜日</h2>${rows}
  </section>`;
}

function segHtml(view) {
  return `<div class="seg" role="group" aria-label="表示の切り替え">
    <button data-view="twoweeks" class="${view === "twoweeks" ? "on" : ""}" aria-pressed="${view === "twoweeks"}">2週間</button>
    <button data-view="month" class="${view === "month" ? "on" : ""}" aria-pressed="${view === "month"}">月間</button>
  </div>`;
}

function renderCalView() {
  const area = loadArea();
  const today = today0();
  const view = calViewMode;

  let main;
  if (view === "twoweeks") {
    /* 今日から14日間すべての日を表示(収集がない日は「収集なし」) */
    let rows = "";
    for (let i = 0; i < 14; i++) {
      const d = addDays(today, i);
      const items = collectionsOn(area, d);
      const wdCls = d.getDay() === 0 ? "sun" : d.getDay() === 6 ? "sat" : "";
      rows += `<div class="sched-row${i === 0 ? " is-today" : ""}">
        <div class="sched-date">${d.getMonth() + 1}/${d.getDate()}<span class="wd ${wdCls}"> (${WEEKDAY_JP[d.getDay()]})</span></div>
        <div class="sched-items">${
          items.length ? items.map(tagHtml).join("")
                       : `<span class="sched-none">収集なし</span>`
        }</div>
        ${i === 0 ? `<span class="today-pill">今日</span>` : ""}
      </div>`;
    }
    main = `<div class="cal-tools"><h2 class="cal-title">今日から2週間</h2>${segHtml(view)}</div>
      <section class="plate" aria-label="2週間の予定">${rows}</section>`;
  } else {
    main = `<div class="cal-tools">${calHeadHtml(calYear, calMonth)}${segHtml(view)}</div>
      <section class="plate" aria-label="${calYear}年${calMonth + 1}月のカレンダー">${calTableHtml(area, calYear, calMonth, today)}</section>`;
  }

  app.innerHTML = `<div class="cal-layout">
      <div class="cal-side">${areaRowHtml(area)}${heroHtml(area, today)}${weeklyHtml(area)}</div>
      <div class="cal-main">${main}</div>
    </div>` + footerHtml();

  document.getElementById("changeArea").onclick = () => renderSetup("town");
  app.querySelectorAll(".seg [data-view]").forEach(b =>
    b.onclick = () => {
      calViewMode = b.dataset.view;
      renderCalView();
    });
  if (view === "month") {
    document.getElementById("calPrev").onclick = () => {
      calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; }
      renderCalView();
    };
    document.getElementById("calNext").onclick = () => {
      calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; }
      renderCalView();
    };
    document.getElementById("calToday").onclick = () => {
      const t = today0();
      calYear = t.getFullYear();
      calMonth = t.getMonth();
      renderCalView();
    };
    document.getElementById("calPrint").onclick = openPrintDialog;
    fitCalendar();
  }
}

/**
 * PC(2列の配置)のとき、月間カレンダーを画面の下端までの高さに広げる。
 * ウィンドウが大きいほどマスも大きくなり、1か月がスクロールせずに見える。
 * 左の看板は CSS で右の高さまで伸びるので、左右の下端も揃う。
 * スマホは上に看板があってカレンダーが画面の下の方から始まるため広げず、
 * CSS のマスの最低の高さのまま並べる。
 */
const WIDE_LAYOUT = matchMedia("(min-width: 1024px)");
function fitCalendar() {
  const table = app.querySelector("table.cal");
  if (!table) return;
  if (!WIDE_LAYOUT.matches) { table.style.height = ""; return; }
  const rows = table.tBodies[0].rows.length;
  const top = table.getBoundingClientRect().top + window.scrollY;
  const avail = window.innerHeight - top - 32; // 32: ページ下の余白ぶん
  // 小さすぎるとバッジが入らず、大きすぎると間延びするので範囲を決めておく
  const h = Math.min(Math.max(avail, rows * 100 + 44), rows * 170 + 44);
  table.style.height = h + "px";
}
window.addEventListener("resize", fitCalendar);

/** 1日ぶんのセルHTML。表示中の月以外の日(前後の月のはみ出し分)は
 *  other クラスを付けて薄く表示する。収集予定も同様に表示する。 */
function calCellHtml(area, month, d, today) {
  const cls = [];
  if (d.getMonth() !== month) cls.push("other");
  if (sameDay(d, today)) cls.push("today");
  if (d.getDay() === 0) cls.push("sun");
  else if (d.getDay() === 6) cls.push("sat");
  const items = collectionsOn(area, d);
  return `<td class="${cls.join(" ")}"><span class="d">${d.getDate()}</span>` +
    items.map(k =>
      `<span class="cal-item ${k}">${ICONS[k]}<span class="cl cl-short">${phrases(CAL_PHRASES[k])}</span><span class="cl cl-full">${phrases(CAT_PHRASES[k])}</span></span>`
    ).join("") +
  `</td>`;
}

/** 指定月のカレンダーテーブル(<table class="cal">)だけを返す。
 *  画面表示(renderCalView)と範囲印刷(printMonths)の両方から使う。 */
function calTableHtml(area, year, month, today) {
  const first = new Date(year, month, 1);
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  // 月初を含む週の日曜〜月末を含む週の土曜まで、前後の月の日も含めて
  // 週ごとの Date 配列に展開する(空セルは作らない)
  const start = addDays(first, -first.getDay());
  const totalDays = Math.ceil((first.getDay() + daysInMonth) / 7) * 7;
  const weeks = [];
  for (let i = 0; i < totalDays; i += 7) {
    weeks.push(Array.from({ length: 7 }, (_, j) => addDays(start, i + j)));
  }

  // --weeks: 印刷CSSが行高を均等割りするための週数(月により4〜6)
  return `<table class="cal" style="--weeks:${weeks.length}"><thead><tr>` +
    WEEKDAY_JP.map((w, i) =>
      `<th class="${i === 0 ? "sun" : i === 6 ? "sat" : ""}">${w}</th>`).join("") +
    `</tr></thead><tbody>` +
    weeks.map(w =>
      `<tr>${w.map(d => calCellHtml(area, month, d, today)).join("")}</tr>`
    ).join("") +
    `</tbody></table>`;
}

function calHeadHtml(year, month) {
  return `<div class="cal-head">
    <button class="circle-btn" id="calPrev" aria-label="前の月">${UI_ICONS.prev}</button>
    <h2 class="title">${year}年${month + 1}月</h2>
    <button class="circle-btn" id="calNext" aria-label="次の月">${UI_ICONS.next}</button>
    <div class="tools">
      <button class="pill-btn" id="calToday">今日へ</button>
      <button class="pill-btn print-btn" id="calPrint" aria-label="印刷">${UI_ICONS.print}<span class="print-label">印刷</span></button>
    </div>
  </div>`;
}

/* =====================================================================
 * 範囲印刷: 表示中の月から指定月まで、1か月1枚でまとめて印刷する。
 * 印刷ボタン → ダイアログで「いつまで」を選択 → #printRange に各月の
 * カレンダーを生成し、body.print-multi を付けて画面の代わりに印刷する。
 * Cmd+P などボタンを経由しない印刷は従来どおり表示中の月のみ。
 * ===================================================================== */
const printDialog = document.getElementById("printDialog");

function openPrintDialog() {
  // <dialog> 非対応の古いブラウザでは従来どおり表示中の月だけ印刷する
  if (!printDialog.showModal) { window.print(); return; }
  const sel = document.getElementById("printUntil");
  sel.innerHTML = Array.from({ length: 12 }, (_, i) => {
    const y = calYear + Math.floor((calMonth + i) / 12);
    const m = (calMonth + i) % 12;
    const note = i === 0 ? "この月のみ" : `${i + 1}か月分`;
    return `<option value="${y}-${m}">${y}年${m + 1}月(${note})</option>`;
  }).join("");
  document.getElementById("printFrom").textContent = `${calYear}年${calMonth + 1}月`;
  printDialog.showModal();
}

document.getElementById("printCancel").onclick = () => printDialog.close();
document.getElementById("printGo").onclick = () => {
  const [ey, em] = document.getElementById("printUntil").value.split("-").map(Number);
  printDialog.close();
  printMonths(calYear, calMonth, (ey - calYear) * 12 + (em - calMonth) + 1);
};

function printMonths(year, month, count) {
  const area = loadArea();
  const today = today0();
  let html = "";
  for (let i = 0; i < count; i++) {
    const y = year + Math.floor((month + i) / 12);
    const m = (month + i) % 12;
    html += `<section class="print-page">
      <div class="area-name">${esc(area.label)}</div>
      <div class="cal-head"><span class="title">${y}年${m + 1}月</span></div>
      ${calTableHtml(area, y, m, today)}
    </section>`;
  }
  document.getElementById("printRange").innerHTML = html;
  document.body.classList.add("print-multi");
  window.print();
}
// 印刷が終わったら通常表示に戻す(生成した数か月分のDOMも破棄する)
window.addEventListener("afterprint", () => {
  document.body.classList.remove("print-multi");
  document.getElementById("printRange").innerHTML = "";
});

/* =====================================================================
 * 分別辞典タブ (774品目・検索 + カテゴリ絞り込み)
 * ===================================================================== */
// 検索用の正規化: NFKC(全角英数→半角等) → 小文字 → ひらがな→カタカナ。
// 公式アプリは「大文字化+全角化+カタカナ化」で data-keyword と部分一致させて
// いるだけなので漢字品目は読みで探せないが、こちらは品目名の読み仮名(yomi)も
// 検索対象に含めており「でんち」→乾電池 のような検索ができる。
function toKatakana(s) {
  return s.replace(/[ぁ-ん]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
}
function normSearch(s) {
  return toKatakana(s.normalize("NFKC").toLowerCase());
}

function jitenMatches() {
  const q = normSearch(jitenQuery.trim());
  return APP_DATA.jiten.filter(it => {
    if (jitenCat && it.cat !== jitenCat) return false;
    if (!q) return true;
    return normSearch(it.name + " " + (it.yomi || "") + " " + it.kw).includes(q);
  });
}

function jitenListHtml() {
  const items = jitenMatches();
  if (!items.length) {
    return `<div class="jiten-count">該当する品目がありません。別の言葉やひらがなで探してみてください</div>`;
  }
  let html = `<div class="jiten-count">${items.length}件</div>`;
  let lastKana = null;
  for (const it of items) {
    if (it.kana !== lastKana) {
      lastKana = it.kana;
      html += `<h2 class="kana-header">${esc(it.kana)}</h2>`;
    }
    const cls = JITEN_CAT_CLASS[it.cat] || "cat-no";
    html += `<details class="acc">
      <summary>
        <span class="jiten-name">${esc(it.name)}</span>
        <span class="jiten-badge ${cls}">${esc(it.cat)}</span>
      </summary>
      <div class="acc-body">
        <div class="detail-label">分別区分</div>
        <div><span class="jiten-badge ${cls}">${esc(it.cat)}</span></div>
        ${it.note ? `<div class="detail-label">注意事項</div><div class="rich">${esc(it.note)}</div>` : ""}
      </div>
    </details>`;
  }
  return html;
}

function renderJiten() {
  app.innerHTML = `<div class="narrow wide">
    <h1 class="page-title">分別辞典</h1>
    <label class="search-box">${UI_ICONS.search}
      <input type="search" id="jitenInput" placeholder="品目名で検索(例: でんち)"
        value="${esc(jitenQuery)}" autocomplete="off" aria-label="品目名で検索">
    </label>
    <div class="cat-chips" role="group" aria-label="分別区分で絞り込む">` +
    JITEN_FILTERS.map(([label, cat]) =>
      `<button data-cat="${esc(cat)}" class="${jitenCat === cat ? "on" : ""}" aria-pressed="${jitenCat === cat}">${esc(label)}</button>`
    ).join("") +
    `</div>
    <div id="jitenList" class="jiten-list">${jitenListHtml()}</div>
  </div>` + footerHtml();

  const input = document.getElementById("jitenInput");
  input.oninput = () => {
    jitenQuery = input.value;
    document.getElementById("jitenList").innerHTML = jitenListHtml();
  };
  app.querySelectorAll(".cat-chips button").forEach(b =>
    b.onclick = () => {
      jitenCat = b.dataset.cat;
      app.querySelectorAll(".cat-chips button").forEach(x => {
        x.classList.toggle("on", x.dataset.cat === jitenCat);
        x.setAttribute("aria-pressed", String(x.dataset.cat === jitenCat));
      });
      document.getElementById("jitenList").innerHTML = jitenListHtml();
    });
}

/* =====================================================================

/* =====================================================================
 * メニュータブ (粗大ごみ / 家電等 / 食べきり / 問い合わせ / FAQ)
 * ===================================================================== */
const MENU_ITEMS = [
  ["sodai", "粗大ごみの申し込み", "電話・インターネット受付"],
  ["kaden", "家電・パソコン・小型充電式電池・注射針の処分", ""],
  ["tabekiri", "食べきり協力店", "食品ロス削減に取り組む店舗"],
  ["contact", "お問い合わせ先", "不法投棄・動物死体など"],
  ["faq", "よくある質問", ""],
];

function renderMenu() {
  if (menuPage) { renderMenuPage(menuPage); return; }
  app.innerHTML = `<div class="narrow">
    <h1 class="page-title">メニュー</h1>
    <div class="menu-list">` +
    MENU_ITEMS.map(([key, label, note]) =>
      `<button data-page="${key}"><span>${esc(label)}${
        note ? `<span class="menu-note">${esc(note)}</span>` : ""
      }</span></button>`).join("") +
    `</div>
  </div>` + footerHtml();
  app.querySelectorAll("[data-page]").forEach(b =>
    b.onclick = () => { menuPage = b.dataset.page; render(); });
}

function backLinkHtml() {
  return `<button class="back-link" id="menuBack">${UI_ICONS.prev}メニューに戻る</button>`;
}
function bindBack() {
  document.getElementById("menuBack").onclick = () => { menuPage = null; render(); };
}

function contactEntriesHtml(entries) {
  return entries.map(e => `<div class="card">
    ${e.title ? `<div class="contact-title">${esc(e.title)}</div>` : ""}
    ${e.org ? `<div class="contact-org">${esc(e.org)}</div>` : ""}
    ${e.fields.map(f =>
      `<div class="detail-label">${esc(f.label)}</div><div class="rich">${f.html}</div>`
    ).join("")}
  </div>`).join("");
}

function renderMenuPage(page) {
  let html = backLinkHtml();

  if (page === "faq") {
    html += `<h1 class="page-title">よくある質問</h1>`;
    let lastCat = null;
    let group = "";
    const flush = () => { if (group) html += `<div class="acc-list">${group}</div>`; group = ""; };
    for (const f of APP_DATA.faq) {
      if (f.cat !== lastCat) {
        flush();
        lastCat = f.cat;
        html += `<h2 class="section-title">${esc(f.cat)}</h2>`;
      }
      group += `<details class="acc">
        <summary><span class="jiten-name">${esc(f.q)}</span></summary>
        <div class="acc-body rich">${f.a}</div>
      </details>`;
    }
    flush();
  } else {
    const data = APP_DATA.contacts[page];
    html += `<h1 class="page-title">${esc(data.title)}</h1>`;
    for (const sec of data.sections) {
      if (sec.label) html += `<h2 class="section-title">${esc(sec.label)}</h2>`;
      html += contactEntriesHtml(sec.entries);
    }
    if (page === "sodai") {
      html += `<div class="snapshot-note">インターネット申込は
        <a href="https://ecolife.e-tumo.jp/toshima-sodai-u/" target="_blank" rel="noopener">粗大ごみ受付センター(外部サイト)</a>
        から。</div>`;
    }
  }

  app.innerHTML = `<div class="narrow">${html}</div>` + footerHtml();
  bindBack();
}

/* ---------- 起動 ---------- */
(async function init() {
  applyTheme();
  updateThemeBtn();
  // 「自動」設定のままOS側のモードが変わったときに追従する
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
    if (currentTheme() === "auto") applyTheme();
  });
  try {
    // no-cache: CDNキャッシュの古いデータを掴まないよう毎回サーバに再検証させる
    const res = await fetch("toshima-gomi.json", { cache: "no-cache" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    DATA = await res.json();
  } catch (e) {
    // file:// で直接開いた場合など。fetch はローカルファイル直開きでは動かない
    app.innerHTML = `<div class="card">
      <b>収集データ (toshima-gomi.json) を読み込めませんでした。</b>
      <div style="margin-top:8px;font-size:13px;color:var(--sub)">
        ローカルで確認する場合は、このフォルダで
        <code>python3 -m http.server 8000</code> を実行して
        <code>http://localhost:8000</code> を開いてください
        (ブラウザで index.html を直接開くと fetch が制限されます)。<br>
        エラー: ${esc(e.message)}
      </div></div>`;
    return;
  }
  // 町名ページの「この地域のカレンダーを開く」から来たとき(?area=地域ID)は、
  // その地域を選んだ状態で開く。URL からは消して、再読み込みや共有で地域を
  // 上書きし続けないようにする
  const linkedArea = new URLSearchParams(location.search).get("area");
  if (linkedArea !== null) {
    if (DATA.areas.some(a => a.id === linkedArea)) localStorage.setItem(STORAGE_KEY, linkedArea);
    history.replaceState(null, "", location.pathname + location.hash);
  }
  const t = today0();
  calYear = t.getFullYear();
  calMonth = t.getMonth();
  render();
})();
</script>
